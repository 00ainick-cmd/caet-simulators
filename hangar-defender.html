            }
        }

        function drawReadyScreen() {
            // Draw enemies in background faded
            ctx.globalAlpha = 0.3;
            enemies.forEach(enemy => {
                if (enemy.active) enemy.draw();
            });
            ctx.globalAlpha = 1;

            // Draw player faded
            if (player) {
                ctx.globalAlpha = 0.5;
                player.draw();
                ctx.globalAlpha = 1;
            }

            // "READY!" text with pulse
            const pulse = Math.sin(readyTimer * 0.2) * 0.3 + 1;
            ctx.fillStyle = COLORS.scoreBonus;
            ctx.font = `bold ${72 * pulse}px "Courier New"`;
            ctx.textAlign = 'center';
            ctx.shadowBlur = 50;
            ctx.shadowColor = COLORS.scoreBonus;
            ctx.fillText('READY!', GAME_WIDTH / 2, GAME_HEIGHT / 2);
            ctx.shadowBlur = 0;
        }

        // ===== STAGE MANAGEMENT =====
        function nextStage() {
            currentStage++;
            createFormation(currentStage);
            if (player) {
                player.x = GAME_WIDTH / 2;
                player.y = GAME_HEIGHT - 80;
            } else {
                player = new Player(GAME_WIDTH / 2, GAME_HEIGHT - 80);
            }
            dualFighterActive = false;
            capturedShip = null;

            startStageIntro(); // New dramatic intro
        }

        function checkStageComplete() {
            if (enemies.filter(e => e.active).length === 0 && gameState === 'PLAYING') {
                // Check for PERFECT CLEAR!
                if (hitsTaken === 0) {
                    showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2, 'PERFECT CLEAR!', COLORS.perfect, 3);
                    showChallengeText('FLAWLESS VICTORY!', COLORS.perfect, 80);
                    addScore(5000);
                    addScreenShake(10, 30);
                    addScreenFlash(COLORS.perfect, 0.5, 30);
                } else {
                    showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2, 'STAGE CLEAR', COLORS.scoreBonus, 2);
                }

                setTimeout(() => {
                    startQuestions();
                }, 2000);
                gameState = 'STAGE_CLEAR';
            }
        }

        // ===== ATTRACT MODE =====
        let attractTimer = 0;

        function drawAttractMode() {
            // Title
            ctx.fillStyle = COLORS.hudText;
            ctx.font = 'bold 48px "Courier New"';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 20;
            ctx.shadowColor = COLORS.hudText;

            const titleY = 100;
            ctx.fillText('HANGAR', GAME_WIDTH / 2, titleY);
            ctx.fillText('DEFENDER', GAME_WIDTH / 2, titleY + 60);
            ctx.shadowBlur = 0;

            // Subtitle
            ctx.font = 'bold 16px "Courier New"';
            ctx.fillStyle = COLORS.player;
            ctx.fillText('Defend • Answer • Dominate', GAME_WIDTH / 2, titleY + 100);

            // Start prompt (blinking)
            if (frameCount % 60 < 30) {
                ctx.font = 'bold 20px "Courier New"';
                ctx.fillStyle = COLORS.scoreBonus;
                ctx.fillText('>>> PRESS SPACE TO START <<<', GAME_WIDTH / 2, titleY + 140);
            }

            // Leaderboard
            ctx.font = 'bold 20px "Courier New"';
            ctx.fillStyle = COLORS.hudText;
            ctx.fillText('═══════ HIGH SCORES ═══════', GAME_WIDTH / 2, titleY + 200);

            const rankText = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];
            ctx.font = '16px "Courier New"';

            for (let i = 0; i < Math.min(10, leaderboard.length); i++) {
                const entry = leaderboard[i];
                const y = titleY + 230 + i * 25;
                const color = i === 0 ? COLORS.scoreBonus : (i < 3 ? COLORS.player : COLORS.hudText);
                ctx.fillStyle = color;
                ctx.fillText(
                    `${rankText[i].padEnd(5)} ${entry.name.padEnd(5)} ${entry.score.toString().padStart(6, '0')}  Stage ${entry.stage}`,
                    GAME_WIDTH / 2,
                    y
                );
            }
        }

        // ===== GAME OVER =====
        let gameOverTimer = 0;

        function drawGameOver() {
            ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = COLORS.warning;
            ctx.font = 'bold 60px "Courier New"';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 30;
            ctx.shadowColor = COLORS.warning;
            ctx.fillText('GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2);
            ctx.shadowBlur = 0;

            ctx.font = 'bold 20px "Courier New"';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`FINAL SCORE: ${score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 60);
            ctx.fillText(`STAGES CLEARED: ${currentStage - 1}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 90);

            if (gameOverTimer > 180) {
                if (frameCount % 60 < 30) {
                    ctx.fillStyle = COLORS.scoreBonus;
                    ctx.fillText('PRESS SPACE TO CONTINUE', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 140);
                }
            }
        }

        // ===== NAME ENTRY SYSTEM =====
        const NAME_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ';

        function updateNameEntry() {
            // Arrow up/down to change character
            if (keys['ArrowUp']) {
                const currentChar = nameEntryData.name[nameEntryData.position];
                const currentIndex = NAME_CHARS.indexOf(currentChar);
                const newIndex = (currentIndex + 1) % NAME_CHARS.length;
                nameEntryData.name[nameEntryData.position] = NAME_CHARS[newIndex];
                keys['ArrowUp'] = false;
            }

            if (keys['ArrowDown']) {
                const currentChar = nameEntryData.name[nameEntryData.position];
                const currentIndex = NAME_CHARS.indexOf(currentChar);
                const newIndex = (currentIndex - 1 + NAME_CHARS.length) % NAME_CHARS.length;
                nameEntryData.name[nameEntryData.position] = NAME_CHARS[newIndex];
                keys['ArrowDown'] = false;
            }

            // Arrow left/right to move cursor
            if (keys['ArrowLeft']) {
                nameEntryData.position = Math.max(0, nameEntryData.position - 1);
                keys['ArrowLeft'] = false;
            }

            if (keys['ArrowRight']) {
                nameEntryData.position = Math.min(2, nameEntryData.position + 1);
                keys['ArrowRight'] = false;
            }

            // Space or Enter to confirm
            if (keys[' '] || keys['Enter']) {
                if (nameEntryData.position < 2) {
                    nameEntryData.position++;
                } else {
                    // Done - add to leaderboard
                    addToLeaderboard();
                    gameState = 'ATTRACT';
                }
                keys[' '] = false;
                keys['Enter'] = false;
            }
        }

        function drawNameEntry() {
            // Background
            ctx.fillStyle = 'rgba(10, 10, 46, 0.95)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Title
            ctx.fillStyle = COLORS.scoreBonus;
            ctx.font = 'bold 36px "Courier New"';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 20;
            ctx.shadowColor = COLORS.scoreBonus;
            ctx.fillText('NEW HIGH SCORE!', GAME_WIDTH / 2, 150);
            ctx.shadowBlur = 0;

            // Rank and score
            const rankText = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];
            ctx.font = 'bold 24px "Courier New"';
            ctx.fillStyle = COLORS.hudText;
            ctx.fillText(`RANK: ${rankText[nameEntryData.rank]}    SCORE: ${score.toString().padStart(6, '0')}`, GAME_WIDTH / 2, 220);

            // Prompt
            ctx.font = 'bold 20px "Courier New"';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('ENTER YOUR INITIALS:', GAME_WIDTH / 2, 280);

            // Name entry boxes
            const boxWidth = 60;
            const boxHeight = 80;
            const spacing = 20;
            const totalWidth = 3 * boxWidth + 2 * spacing;
            const startX = (GAME_WIDTH - totalWidth) / 2;
            const boxY = 320;

            for (let i = 0; i < 3; i++) {
                const x = startX + i * (boxWidth + spacing);

                // Box
                if (i === nameEntryData.position) {
                    ctx.strokeStyle = COLORS.scoreBonus;
                    ctx.lineWidth = 4;
                } else {
                    ctx.strokeStyle = COLORS.hudText;
                    ctx.lineWidth = 2;
                }
                ctx.strokeRect(x, boxY, boxWidth, boxHeight);

                // Character
                ctx.fillStyle = i === nameEntryData.position ? COLORS.scoreBonus : '#ffffff';
                ctx.font = 'bold 48px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText(nameEntryData.name[i], x + boxWidth / 2, boxY + boxHeight / 2 + 18);

                // Cursor blink
                if (i === nameEntryData.position && frameCount % 30 < 15) {
                    ctx.fillStyle = COLORS.scoreBonus;
                    ctx.fillRect(x + 10, boxY - 10, boxWidth - 20, 4);
                }
            }

            // Instructions
            ctx.font = '16px "Courier New"';
            ctx.fillStyle = COLORS.hudText;
            ctx.textAlign = 'center';
            ctx.fillText('[UP/DOWN: Change Letter]', GAME_WIDTH / 2, 470);
            ctx.fillText('[LEFT/RIGHT: Move Cursor]', GAME_WIDTH / 2, 495);
            ctx.fillText('[SPACE/ENTER: Next/Confirm]', GAME_WIDTH / 2, 520);
        }

        // ===== PAUSE SYSTEM =====
        function drawPause() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = COLORS.scoreBonus;
            ctx.font = 'bold 48px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('PAUSED', GAME_WIDTH / 2, GAME_HEIGHT / 2);

            ctx.font = '20px "Courier New"';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('Press ESC or SPACE to resume', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 50);
        }

        // ===== INITIALIZE GAME =====
        function initGame() {
            // Create star field
            for (let i = 0; i < 150; i++) {
                stars.push(new Star());
            }

            // Initialize audio
            initAudio();

            // Load high score
            loadHighScore();

            // Set initial state
            gameState = 'ATTRACT';

            // Hide loading screen
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 1000);
        }

        // ===== START NEW GAME =====
        function startNewGame() {
            currentStage = 1;
            score = 0;
            lives = 3;
            extraLifeThreshold = 10000;
            gameState = 'PLAYING';
            dualFighterActive = false;
            capturedShip = null;

            player = new Player(GAME_WIDTH / 2, GAME_HEIGHT - 80);
            createFormation(currentStage);

            bullets = [];
            particles = [];
        }

        // ===== MAIN UPDATE LOOP =====
        function update(deltaTime) {
            frameCount++;

            // Update ALL arcade effects
            updateScreenShake();
            updateScreenFlash();
            updateComboSystem();
            updateSlowMotion();
            updateChallengeText();
            updateBossWarning();
            updateStageTransition();
            updateBulletTrails();

            // Update stars
            stars.forEach(star => star.update());

            // Update particles
            particles.forEach(particle => particle.update());
            particles = particles.filter(p => p.active);

            // Update floating texts
            updateFloatingTexts();

            // State-specific updates
            switch(gameState) {
                case 'ATTRACT':
                    attractTimer++;
                    if (keys[' ']) {
                        startNewGame();
                        keys[' '] = false;
                    }
                    break;

                case 'PLAYING':
                    if (player) {
                        player.update(deltaTime);
                    }

                    bullets.forEach(bullet => bullet.update());
                    bullets = bullets.filter(b => b.active);

                    const formationOffset = Math.sin(frameCount * 0.01) * 30;
                    enemies.forEach(enemy => enemy.update(formationOffset));

                    updateDiveAttacks();
                    checkCollisions();
                    checkStageComplete();
                    break;

                case 'STAGE_CLEAR':
                    // Wait for transition
                    break;

                case 'STAGE_INTRO':
                    updateStageIntro();
                    break;

                case 'READY':
                    updateReadyScreen();
                    // Still update enemies for visual effect
                    const formationOffset = Math.sin(frameCount * 0.01) * 30;
                    enemies.forEach(enemy => enemy.update(formationOffset));
                    break;

                case 'QUESTIONS':
                    updateQuestions();
                    break;

                case 'BONUS':
                    if (player) {
                        player.update(deltaTime);
                    }
                    bullets.forEach(bullet => bullet.update());
                    bullets = bullets.filter(b => b.active);
                    enemies.forEach(enemy => enemy.update(0));
                    checkCollisions();
                    updateBonusStage();
                    break;

                case 'PAUSED':
                    if (keys['Escape'] || keys[' ']) {
                        gameState = 'PLAYING';
                        keys['Escape'] = false;
                        keys[' '] = false;
                    }
                    break;

                case 'GAME_OVER':
                    gameOverTimer++;
                    if (gameOverTimer === 180) {
                        // Check for high score after delay
                        if (!checkHighScore()) {
                            // Not a high score, continue to attract mode prompt
                        }
                    }
                    if (gameOverTimer > 180 && keys[' '] && gameState === 'GAME_OVER') {
                        gameState = 'ATTRACT';
                        gameOverTimer = 0;
                        keys[' '] = false;
                    }
                    break;

                case 'NAME_ENTRY':
                    updateNameEntry();
                    break;
            }

            // Pause check
            if (gameState === 'PLAYING' && keys['Escape']) {
                gameState = 'PAUSED';
                keys['Escape'] = false;
            }
        }

        // ===== MAIN DRAW LOOP =====
        function draw() {
            // Clear canvas
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Apply screen shake
            ctx.save();
            ctx.translate(screenShake.x, screenShake.y);

            // Draw stars
            stars.forEach(star => star.draw());

            // State-specific rendering
            switch(gameState) {
                case 'ATTRACT':
                    drawAttractMode();
                    break;

                case 'STAGE_INTRO':
                    drawStageIntro();
                    break;

                case 'READY':
                    drawReadyScreen();
                    break;

                case 'PLAYING':
                case 'STAGE_CLEAR':
                case 'BONUS':
                    // Draw enemies
                    enemies.forEach(enemy => {
                        if (enemy.active) enemy.draw();
                    });

                    // Draw bullet trails FIRST (under bullets)
                    bulletTrails.forEach(trail => trail.draw());

                    // Draw bullets
                    bullets.forEach(bullet => bullet.draw());

                    // Draw player
                    if (player) {
                        if (dualFighterActive) {
                            // Draw two ships side-by-side
                            ctx.save();
                            ctx.translate(-30, 0);
                            player.draw();
                            ctx.restore();

                            ctx.save();
                            ctx.translate(30, 0);
                            player.draw();
                            ctx.restore();
                        } else {
                            player.draw();
                        }
                    }

                    // Draw particles
                    particles.forEach(particle => particle.draw());

                    // Draw HUD
                    drawHUD();

                    // Draw floating texts
                    drawFloatingTexts();

                    // Draw challenge text (NICE!, EXCELLENT!, etc.)
                    drawChallengeText();

                    // Draw boss warning if active
                    drawBossWarning();

                    if (gameState === 'BONUS') {
                        drawBonusStage();
                    }
                    break;

                case 'QUESTIONS':
                    drawQuestions();
                    break;

                case 'PAUSED':
                    // Draw game state first
                    enemies.forEach(enemy => {
                        if (enemy.active) enemy.draw();
                    });
                    bullets.forEach(bullet => bullet.draw());
                    if (player) player.draw();
                    drawHUD();

                    // Then draw pause overlay
                    drawPause();
                    break;

                case 'GAME_OVER':
                    drawGameOver();
                    break;

                case 'NAME_ENTRY':
                    drawNameEntry();
                    break;
            }

            // Restore context (end screen shake)
            ctx.restore();

            // Draw screen flash on top of everything
            if (screenFlash.active) {
                ctx.fillStyle = screenFlash.color;
                ctx.globalAlpha = screenFlash.alpha;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                ctx.globalAlpha = 1;
            }

            // Draw stage transition last (on top of EVERYTHING)
            drawStageTransition();

            // Slow motion indicator
            if (slowMotion.active) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.font = 'bold 20px "Courier New"';
                ctx.textAlign = 'right';
                ctx.fillText('SLOW-MO', GAME_WIDTH - 20, GAME_HEIGHT - 20);
            }
        }

        // ===== GAME LOOP =====
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastFrameTime;

            if (deltaTime >= FRAME_TIME) {
                update(deltaTime);
                draw();
                lastFrameTime = timestamp;
            }

            requestAnimationFrame(gameLoop);
        }

        // ===== INPUT HANDLING =====
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            // Prevent default for game keys
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Enter', 'Escape'].includes(e.key)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // ===== START GAME =====
        window.addEventListener('load', () => {
            initGame();
            requestAnimationFrame(gameLoop);
        });

    </script>
</body>
</html>
