<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANGAR DEFENDER - Aviation CAET Study Game</title>
    <style>
        /* ===== SEGA GENESIS AESTHETIC ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: #0a0a2e;
            border: 4px solid #00ff41;
            box-shadow: 0 0 20px #00ff41, inset 0 0 40px rgba(0, 255, 65, 0.1);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* CRT Scanlines Effect */
        #gameContainer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 1px,
                rgba(0, 0, 0, 0.5) 1px,
                rgba(0, 0, 0, 0.5) 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* CRT Screen Curvature */
        #gameContainer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 11;
        }

        /* Glow effect for high-contrast elements */
        .glow {
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
        }

        /* Loading screen */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ff41;
            font-size: 24px;
            z-index: 100;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .blink {
            animation: blink 1s infinite;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="loadingScreen">
            <div class="glow">HANGAR DEFENDER</div>
            <div style="margin-top: 20px; font-size: 16px;">INITIALIZING SYSTEMS...</div>
            <div class="blink" style="margin-top: 20px; font-size: 14px;">PRESS SPACE TO START</div>
        </div>
    </div>

    <script>
        // ============================================
        // HANGAR DEFENDER - GALAGA CLONE
        // Aviation CAET Study Game
        // Sega Genesis Aesthetic
        // ============================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const loadingScreen = document.getElementById('loadingScreen');

        // ===== GAME CONSTANTS =====
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 600;
        const FPS = 60;
        const FRAME_TIME = 1000 / FPS;

        // ===== COLOR PALETTE (16-BIT SEGA GENESIS) =====
        const COLORS = {
            background: '#0a0a2e',
            player: '#00ffff',
            boss: '#3366ff',
            butterfly: '#ff3366',
            dragonfly: '#33ff66',
            bee: '#ffff33',
            bullet: '#00ff00',
            tractorBeam: '#66ccff',
            hudText: '#00ff41',
            explosion1: '#ff6600',
            explosion2: '#ffff00',
            explosion3: '#ffffff',
            scoreBonus: '#ffff00',
            warning: '#ff0000',
            perfect: '#ff00ff'
        };

        // ===== GAME STATE =====
        let gameState = 'ATTRACT'; // ATTRACT, PLAYING, PAUSED, GAME_OVER, QUESTIONS, BONUS, NAME_ENTRY, STAGE_INTRO, READY
        let currentStage = 1;
        let score = 0;
        let highScore = 0;
        let lives = 3;
        let extraLifeThreshold = 10000;
        let lastFrameTime = 0;
        let keys = {};
        let frameCount = 0;

        // ===== ARCADE JUICE EFFECTS =====
        let screenShake = { x: 0, y: 0, intensity: 0, duration: 0 };
        let screenFlash = { active: false, color: '#ffffff', alpha: 0, duration: 0 };
        let comboCount = 0;
        let comboTimer = 0;
        let lastKillTime = 0;
        let killStreak = 0;
        let stageIntroTimer = 0;
        let readyTimer = 0;
        let perfectClearActive = false;
        let slowMotion = { active: false, duration: 0, factor: 0.3 };
        let challengeText = { active: false, text: '', color: '#fff', duration: 0, scale: 1 };
        let stageTransition = { active: false, type: 'fade', progress: 0, direction: 'in' };
        let bossWarning = { active: false, duration: 0 };
        let hitsTaken = 0;
        let bulletTrails = [];

        // ===== ENTITY ARRAYS =====
        let player = null;
        let capturedShip = null;
        let dualFighterActive = false;
        let enemies = [];
        let bullets = [];
        let particles = [];
        let stars = [];

        // ===== GAME SETTINGS =====
        let settings = {
            soundEnabled: true,
            musicEnabled: true
        };

        // ===== ARCADE EFFECTS FUNCTIONS =====
        function addScreenShake(intensity, duration) {
            screenShake.intensity = intensity;
            screenShake.duration = duration;
        }

        function updateScreenShake() {
            if (screenShake.duration > 0) {
                screenShake.duration--;
                const intensity = screenShake.intensity * (screenShake.duration / 30);
                screenShake.x = (Math.random() - 0.5) * intensity;
                screenShake.y = (Math.random() - 0.5) * intensity;
            } else {
                screenShake.x = 0;
                screenShake.y = 0;
            }
        }

        function addScreenFlash(color, alpha, duration) {
            screenFlash.active = true;
            screenFlash.color = color;
            screenFlash.alpha = alpha;
            screenFlash.duration = duration;
        }

        function updateScreenFlash() {
            if (screenFlash.duration > 0) {
                screenFlash.duration--;
                screenFlash.alpha *= 0.9; // Fade out
            } else {
                screenFlash.active = false;
            }
        }

        function updateComboSystem() {
            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer === 0) {
                    comboCount = 0;
                    killStreak = 0;
                }
            }
        }

        function addComboKill() {
            const now = Date.now();
            if (now - lastKillTime < 2000) { // 2 second combo window
                comboCount++;
                killStreak++;
                comboTimer = 120; // 2 seconds at 60fps

                // Combo announcements with EPIC effects
                if (comboCount === 5) {
                    showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2 - 50, '5 COMBO!', COLORS.scoreBonus, 2);
                    addScreenFlash(COLORS.scoreBonus, 0.3, 10);
                    showChallengeText('NICE!', COLORS.scoreBonus, 40);
                } else if (comboCount === 10) {
                    showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2 - 50, '10 COMBO!!', COLORS.perfect, 2.5);
                    addScreenShake(8, 15);
                    addScreenFlash(COLORS.perfect, 0.4, 15);
                    showChallengeText('EXCELLENT!!', COLORS.perfect, 50);
                } else if (comboCount === 20) {
                    showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2 - 50, '20 COMBO!!!', COLORS.warning, 3);
                    addScreenShake(12, 20);
                    addScreenFlash(COLORS.warning, 0.5, 20);
                    showChallengeText('UNSTOPPABLE!!!', COLORS.warning, 60);
                    // ACTIVATE SLOW MOTION FOR EPIC MOMENT
                    activateSlowMotion(90); // 1.5 seconds
                }
            } else {
                comboCount = 1;
                killStreak = 1;
                comboTimer = 120;
            }
            lastKillTime = now;
        }

        // ===== SLOW MOTION SYSTEM =====
        function activateSlowMotion(duration) {
            slowMotion.active = true;
            slowMotion.duration = duration;
        }

        function updateSlowMotion() {
            if (slowMotion.duration > 0) {
                slowMotion.duration--;
            } else {
                slowMotion.active = false;
            }
        }

        function getTimeFactor() {
            return slowMotion.active ? slowMotion.factor : 1.0;
        }

        // ===== CHALLENGE TEXT SYSTEM =====
        function showChallengeText(text, color, duration) {
            challengeText.active = true;
            challengeText.text = text;
            challengeText.color = color;
            challengeText.duration = duration;
            challengeText.scale = 0.1; // Start small
        }

        function updateChallengeText() {
            if (challengeText.duration > 0) {
                challengeText.duration--;
                // Scale up quickly then fade
                if (challengeText.scale < 1.5) {
                    challengeText.scale += 0.1;
                }
            } else {
                challengeText.active = false;
            }
        }

        function drawChallengeText() {
            if (!challengeText.active) return;

            const alpha = Math.min(challengeText.duration / 20, 1);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = challengeText.color;
            ctx.font = `bold ${Math.floor(48 * challengeText.scale)}px "Courier New"`;
            ctx.textAlign = 'center';
            ctx.shadowBlur = 30;
            ctx.shadowColor = challengeText.color;
            ctx.fillText(challengeText.text, GAME_WIDTH / 2, GAME_HEIGHT / 3);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }

        // ===== BOSS WARNING SYSTEM =====
        function activateBossWarning() {
            bossWarning.active = true;
            bossWarning.duration = 120; // 2 seconds
            addScreenShake(6, 20);
            addScreenFlash('#ff0000', 0.3, 15);
            showChallengeText('WARNING!', COLORS.warning, 80);
            playSound('warning');
        }

        function updateBossWarning() {
            if (bossWarning.duration > 0) {
                bossWarning.duration--;
            } else {
                bossWarning.active = false;
            }
        }

        function drawBossWarning() {
            if (!bossWarning.active) return;

            const flash = Math.floor(bossWarning.duration / 10) % 2;
            if (flash === 0) return;

            ctx.fillStyle = COLORS.warning;
            ctx.font = 'bold 32px "Courier New"';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 20;
            ctx.shadowColor = COLORS.warning;
            ctx.fillText('! MULTIPLE HOSTILES DETECTED !', GAME_WIDTH / 2, 120);
            ctx.shadowBlur = 0;
        }

        // ===== STAGE TRANSITION SYSTEM =====
        function startStageTransition(direction = 'in') {
            stageTransition.active = true;
            stageTransition.direction = direction;
            stageTransition.progress = 0;
        }

        function updateStageTransition() {
            if (stageTransition.active) {
                stageTransition.progress += 0.02;
                if (stageTransition.progress >= 1) {
                    stageTransition.active = false;
                }
            }
        }

        function drawStageTransition() {
            if (!stageTransition.active) return;

            const alpha = stageTransition.direction === 'in'
                ? 1 - stageTransition.progress
                : stageTransition.progress;

            ctx.fillStyle = '#000000';
            ctx.globalAlpha = alpha;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            ctx.globalAlpha = 1;
        }

        // ===== BULLET TRAIL SYSTEM =====
        class BulletTrail {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.life = 10;
                this.maxLife = 10;
            }

            update() {
                this.life--;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.globalAlpha = alpha * 0.5;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x - 2, this.y - 6, 4, 12);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        function updateBulletTrails() {
            bulletTrails.forEach(trail => trail.update());
            bulletTrails = bulletTrails.filter(t => t.life > 0);
        }

        // ===== PLAYER CLASS =====
        class Player {
            constructor(x, y, isDual = false) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 40;
                this.speed = 5;
                this.shootCooldown = 0;
                this.shootCooldownTime = 250; // ms
                this.lastShot = 0;
                this.isDual = isDual;
                this.color = COLORS.player;
                this.engineGlow = 0;
                this.muzzleFlash = 0;
            }

            update(deltaTime) {
                // Movement
                if (keys['ArrowLeft'] && this.x > this.width / 2) {
                    this.x -= this.speed;
                }
                if (keys['ArrowRight'] && this.x < GAME_WIDTH - this.width / 2) {
                    this.x += this.speed;
                }

                // Shooting
                if ((keys[' '] || keys['Enter']) && Date.now() - this.lastShot > this.shootCooldownTime) {
                    this.shoot();
                    this.lastShot = Date.now();
                    this.muzzleFlash = 8; // 8 frames of muzzle flash
                    playSound('shoot');
                    addScreenShake(2, 3); // Subtle shake on shoot
                }

                // Engine glow animation
                this.engineGlow = (this.engineGlow + 0.1) % (Math.PI * 2);

                // Muzzle flash decay
                if (this.muzzleFlash > 0) {
                    this.muzzleFlash--;
                }
            }

            shoot() {
                if (this.isDual) {
                    // Dual fighter shoots two bullets
                    bullets.push(new Bullet(this.x - 15, this.y - 20));
                    bullets.push(new Bullet(this.x + 15, this.y - 20));
                } else {
                    bullets.push(new Bullet(this.x, this.y - 20));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Muzzle flash
                if (this.muzzleFlash > 0) {
                    const flashAlpha = this.muzzleFlash / 8;
                    ctx.fillStyle = `rgba(255, 255, 100, ${flashAlpha})`;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(0, -25, 8 * flashAlpha, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Draw player ship (classic fighter jet from top-down view)
                // Body with enhanced detail
                ctx.fillStyle = COLORS.player;
                ctx.shadowBlur = 10;
                ctx.shadowColor = COLORS.player;
                ctx.beginPath();
                ctx.moveTo(0, -20); // Nose
                ctx.lineTo(-8, 0); // Left wing
                ctx.lineTo(-6, 10); // Left tail
                ctx.lineTo(6, 10); // Right tail
                ctx.lineTo(8, 0); // Right wing
                ctx.closePath();
                ctx.fill();

                // Wing details
                ctx.strokeStyle = '#00aaaa';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-6, -5);
                ctx.lineTo(-8, 0);
                ctx.moveTo(6, -5);
                ctx.lineTo(8, 0);
                ctx.stroke();

                // Cockpit with glow
                ctx.fillStyle = '#ffff33';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffff00';
                ctx.beginPath();
                ctx.arc(0, -5, 4, 0, Math.PI * 2);
                ctx.fill();

                // Engine glow (animated)
                const glowAlpha = 0.5 + Math.sin(this.engineGlow) * 0.3;
                ctx.fillStyle = `rgba(0, 255, 255, ${glowAlpha})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = COLORS.player;
                ctx.beginPath();
                ctx.arc(-6, 10, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(6, 10, 3, 0, Math.PI * 2);
                ctx.fill();

                // Engine trail particles
                if (frameCount % 3 === 0) {
                    particles.push(new Particle(this.x - 6, this.y + 10, COLORS.player, 0, 1, 15, 2));
                    particles.push(new Particle(this.x + 6, this.y + 10, COLORS.player, 0, 1, 15, 2));
                }

                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }

        // ===== BULLET CLASS =====
        class Bullet {
            constructor(x, y, speed = 8, color = COLORS.bullet, isEnemy = false) {
                this.x = x;
                this.y = y;
                this.width = 4;
                this.height = 12;
                this.speed = speed;
                this.color = color;
                this.isEnemy = isEnemy;
                this.active = true;
            }

            update() {
                // Create bullet trail
                if (!this.isEnemy && frameCount % 2 === 0) {
                    bulletTrails.push(new BulletTrail(this.x, this.y, this.color));
                }

                const timeFactor = getTimeFactor();
                const adjustedSpeed = this.speed * timeFactor;

                if (this.isEnemy) {
                    this.y += adjustedSpeed;
                } else {
                    this.y -= adjustedSpeed;
                }

                // Remove if off screen
                if (this.y < 0 || this.y > GAME_HEIGHT) {
                    this.active = false;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);
                ctx.shadowBlur = 0;
            }

            collidesWith(entity) {
                return this.x < entity.x + entity.width / 2 &&
                       this.x > entity.x - entity.width / 2 &&
                       this.y < entity.y + entity.height / 2 &&
                       this.y > entity.y - entity.height / 2;
            }
        }

        // ===== ENEMY CLASS =====
        class Enemy {
            constructor(type, formationX, formationY, gridX, gridY) {
                this.type = type; // 'boss', 'butterfly', 'dragonfly', 'bee'
                this.formationX = formationX;
                this.formationY = formationY;
                this.gridX = gridX;
                this.gridY = gridY;
                this.x = formationX;
                this.y = -50; // Start above screen
                this.vx = 0;
                this.vy = 0;
                this.state = 'ENTERING'; // ENTERING, FORMATION, DIVING, RETURNING
                this.active = true;
                this.diving = false;
                this.diveProgress = 0;
                this.divePattern = null;
                this.capturedShip = null;
                this.tractorBeamActive = false;
                this.tractorBeamProgress = 0;
                this.animFrame = 0;
                this.animSpeed = 0.1;
                this.hitFlash = 0; // Hit flash effect

                // Set properties based on type
                this.setupType();
            }

            setupType() {
                switch(this.type) {
                    case 'boss':
                        this.width = 40;
                        this.height = 40;
                        this.color = COLORS.boss;
                        this.pointsFormation = 150;
                        this.pointsDiving = 400;
                        break;
                    case 'butterfly':
                        this.width = 32;
                        this.height = 32;
                        this.color = COLORS.butterfly;
                        this.pointsFormation = 80;
                        this.pointsDiving = 160;
                        break;
                    case 'dragonfly':
                        this.width = 30;
                        this.height = 30;
                        this.color = COLORS.dragonfly;
                        this.pointsFormation = 100;
                        this.pointsDiving = 160;
                        break;
                    case 'bee':
                        this.width = 24;
                        this.height = 24;
                        this.color = COLORS.bee;
                        this.pointsFormation = 50;
                        this.pointsDiving = 100;
                        break;
                }
            }

            update(formationOffsetX = 0) {
                this.animFrame += this.animSpeed;

                // Decay hit flash
                if (this.hitFlash > 0) {
                    this.hitFlash--;
                }

                switch(this.state) {
                    case 'ENTERING':
                        // Move to formation position
                        const dx = this.formationX + formationOffsetX - this.x;
                        const dy = this.formationY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 5) {
                            this.state = 'FORMATION';
                            this.x = this.formationX + formationOffsetX;
                            this.y = this.formationY;
                        } else {
                            this.x += dx * 0.05;
                            this.y += dy * 0.05;
                        }
                        break;

                    case 'FORMATION':
                        // Idle in formation with slow horizontal movement
                        this.x = this.formationX + formationOffsetX;
                        break;

                    case 'DIVING':
                        this.executeDive();
                        break;

                    case 'RETURNING':
                        // Return to formation
                        const rdx = this.formationX + formationOffsetX - this.x;
                        const rdy = this.formationY - this.y;
                        const rdist = Math.sqrt(rdx * rdx + rdy * rdy);

                        if (rdist < 5) {
                            this.state = 'FORMATION';
                            this.diving = false;
                        } else {
                            this.x += rdx * 0.03;
                            this.y += rdy * 0.03;
                        }
                        break;
                }

                // Update tractor beam
                if (this.tractorBeamActive) {
                    this.tractorBeamProgress += 0.1;
                    if (this.tractorBeamProgress > 1.5) {
                        this.tractorBeamActive = false;
                        this.tractorBeamProgress = 0;
                    }
                }
            }

            startDive() {
                if (this.state === 'FORMATION' && !this.diving) {
                    this.state = 'DIVING';
                    this.diving = true;
                    this.diveProgress = 0;

                    // Boss has chance to activate tractor beam
                    if (this.type === 'boss' && Math.random() < 0.25) {
                        this.tractorBeamActive = true;
                        playSound('tractorBeam');
                    }
                }
            }

            executeDive() {
                this.diveProgress += 0.02;

                const centerX = GAME_WIDTH / 2;
                const centerY = GAME_HEIGHT / 2;

                switch(this.type) {
                    case 'boss':
                        // Gentle arc toward player
                        const t = this.diveProgress;
                        this.x = this.formationX + Math.sin(t * Math.PI) * 150;
                        this.y = this.formationY + t * 400;
                        break;

                    case 'butterfly':
                        // Figure-8 swoop
                        const bt = this.diveProgress * Math.PI * 2;
                        this.x = this.formationX + Math.sin(bt) * 100;
                        this.y = this.formationY + this.diveProgress * 350 + Math.sin(bt * 2) * 50;
                        break;

                    case 'bee':
                        // Fast straight dive
                        this.y = this.formationY + this.diveProgress * 500;
                        this.x += (player.x - this.x) * 0.01;
                        break;

                    case 'dragonfly':
                        // Wide looping pattern
                        const dt = this.diveProgress * Math.PI;
                        this.x = this.formationX + Math.cos(dt) * 120;
                        this.y = this.formationY + this.diveProgress * 380;
                        break;
                }

                // Check if dive complete
                if (this.diveProgress >= 1 || this.y > GAME_HEIGHT + 50) {
                    this.state = 'RETURNING';
                    this.tractorBeamActive = false;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Hit flash effect
                if (this.hitFlash > 0) {
                    ctx.globalAlpha = 0.5 + (this.hitFlash / 10) * 0.5;
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }

                // Draw enemy based on type
                switch(this.type) {
                    case 'boss':
                        this.drawBoss();
                        break;
                    case 'butterfly':
                        this.drawButterfly();
                        break;
                    case 'dragonfly':
                        this.drawDragonfly();
                        break;
                    case 'bee':
                        this.drawBee();
                        break;
                }

                // Draw tractor beam if active
                if (this.tractorBeamActive) {
                    this.drawTractorBeam();
                }

                ctx.restore();

                // Draw captured ship if exists
                if (this.capturedShip) {
                    ctx.save();
                    ctx.translate(this.x, this.y + 50);
                    ctx.globalAlpha = 0.7;
                    this.drawCapturedShip();
                    ctx.restore();
                }
            }

            drawBoss() {
                // Large bug with circuit board pattern
                const wingSpan = Math.sin(this.animFrame) * 3;

                ctx.fillStyle = this.color;
                // Body
                ctx.beginPath();
                ctx.ellipse(0, 0, 15, 20, 0, 0, Math.PI * 2);
                ctx.fill();

                // Wings
                ctx.beginPath();
                ctx.ellipse(-12 - wingSpan, -5, 8, 15, -0.3, 0, Math.PI * 2);
                ctx.ellipse(12 + wingSpan, -5, 8, 15, 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Circuit pattern
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-8, -10);
                ctx.lineTo(8, -10);
                ctx.moveTo(0, -10);
                ctx.lineTo(0, 10);
                ctx.stroke();

                // Eyes
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(-5, -5, 3, 0, Math.PI * 2);
                ctx.arc(5, -5, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            drawButterfly() {
                // Medium alien with spread wings
                const wingFlap = Math.sin(this.animFrame) * 4;

                ctx.fillStyle = this.color;
                // Body
                ctx.fillRect(-4, -10, 8, 20);

                // Wings
                ctx.beginPath();
                ctx.moveTo(-4, 0);
                ctx.quadraticCurveTo(-15 - wingFlap, -10, -12 - wingFlap, -18);
                ctx.quadraticCurveTo(-8, -15, -4, -5);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(4, 0);
                ctx.quadraticCurveTo(15 + wingFlap, -10, 12 + wingFlap, -18);
                ctx.quadraticCurveTo(8, -15, 4, -5);
                ctx.fill();

                // Wire traces
                ctx.strokeStyle = '#ff6699';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-10, -15);
                ctx.lineTo(10, -15);
                ctx.stroke();
            }

            drawDragonfly() {
                // Elongated body with antenna
                ctx.fillStyle = this.color;

                // Body segments
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.arc(0, -10 + i * 6, 6 - i * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Wings
                const wingAngle = Math.sin(this.animFrame) * 0.2;
                ctx.save();
                ctx.rotate(wingAngle);
                ctx.fillStyle = 'rgba(51, 255, 102, 0.5)';
                ctx.fillRect(-15, -8, 10, 3);
                ctx.fillRect(5, -8, 10, 3);
                ctx.restore();

                // Antenna
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-3, -12);
                ctx.lineTo(-5, -18);
                ctx.moveTo(3, -12);
                ctx.lineTo(5, -18);
                ctx.stroke();
            }

            drawBee() {
                // Small compact wasp
                ctx.fillStyle = this.color;

                // Body
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();

                // Stripes
                ctx.fillStyle = '#000';
                ctx.fillRect(-8, -2, 16, 2);
                ctx.fillRect(-8, 2, 16, 2);

                // Stinger
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(-3, 8);
                ctx.lineTo(0, 12);
                ctx.lineTo(3, 8);
                ctx.fill();

                // Wings (subtle)
                const wingBuzz = Math.sin(this.animFrame * 2) * 2;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.ellipse(-6, -3 + wingBuzz, 4, 6, -0.5, 0, Math.PI * 2);
                ctx.ellipse(6, -3 + wingBuzz, 4, 6, 0.5, 0, Math.PI * 2);
                ctx.fill();
            }

            drawTractorBeam() {
                const beamWidth = 50;
                const beamHeight = 200;
                const pulse = Math.sin(this.tractorBeamProgress * 10) * 0.3 + 0.7;

                ctx.save();
                ctx.globalAlpha = 0.5 * pulse;

                // Beam gradient
                const gradient = ctx.createLinearGradient(0, 0, 0, beamHeight);
                gradient.addColorStop(0, COLORS.tractorBeam);
                gradient.addColorStop(1, 'rgba(102, 204, 255, 0)');

                ctx.fillStyle = gradient;
                ctx.fillRect(-beamWidth / 2, 20, beamWidth, beamHeight);

                // Beam particles
                for (let i = 0; i < 10; i++) {
                    const py = 20 + (this.tractorBeamProgress * beamHeight + i * 20) % beamHeight;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(Math.sin(i) * 20, py, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            drawCapturedShip() {
                // Draw mini player ship
                ctx.fillStyle = COLORS.player;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(-4, 0);
                ctx.lineTo(-3, 5);
                ctx.lineTo(3, 5);
                ctx.lineTo(4, 0);
                ctx.closePath();
                ctx.fill();
            }

            collidesWith(entity) {
                return Math.abs(this.x - entity.x) < (this.width + entity.width) / 2 &&
                       Math.abs(this.y - entity.y) < (this.height + entity.height) / 2;
            }
        }

        // ===== PARTICLE CLASS =====
        class Particle {
            constructor(x, y, color, vx, vy, life = 30, size = 3) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.life = life;
                this.maxLife = life;
                this.size = size;
                this.active = true;
                this.gravity = 0.1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity; // Add gravity
                this.life--;
                if (this.life <= 0) this.active = false;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 5;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        // ===== STAR FIELD =====
        class Star {
            constructor() {
                this.x = Math.random() * GAME_WIDTH;
                this.y = Math.random() * GAME_HEIGHT;
                this.size = Math.random() * 2 + 1;
                this.speed = this.size * 0.5; // Parallax based on size
                this.brightness = Math.random() * 0.5 + 0.5;
                this.twinkle = Math.random() * Math.PI * 2;
            }

            update() {
                this.y += this.speed;
                if (this.y > GAME_HEIGHT) {
                    this.y = 0;
                    this.x = Math.random() * GAME_WIDTH;
                }
                this.twinkle += 0.05;
            }

            draw() {
                const alpha = this.brightness + Math.sin(this.twinkle) * 0.2;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.size > 2 ? '#66ccff' : '#ffffff';
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        // ===== SOUND SYSTEM (Web Audio API) =====
        let audioContext = null;
        let soundBuffers = {};

        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                console.log('Web Audio API not supported');
            }
        }

        function playSound(soundName) {
            if (!settings.soundEnabled || !audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Different sounds for different events
            switch(soundName) {
                case 'shoot':
                    oscillator.frequency.value = 800;
                    oscillator.type = 'square';
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.1);
                    break;

                case 'explosion':
                    oscillator.frequency.value = 200;
                    oscillator.type = 'sawtooth';
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.3);
                    break;

                case 'tractorBeam':
                    oscillator.frequency.value = 150;
                    oscillator.type = 'sine';
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 1);
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 1);
                    break;

                case 'extraLife':
                    oscillator.frequency.value = 1200;
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.2);
                    break;

                case 'correct':
                    oscillator.frequency.value = 1000;
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.15);
                    break;

                case 'wrong':
                    oscillator.frequency.value = 300;
                    oscillator.type = 'sawtooth';
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.4);
                    break;

                case 'warning':
                    // GPWS-style warning - alternating high/low tones
                    oscillator.frequency.value = 800;
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    oscillator.frequency.setValueAtTime(400, audioContext.currentTime + 0.2);
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime + 0.4);
                    oscillator.type = 'square';
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.6);
                    break;
            }
        }

        // ===== EXPLOSION EFFECT =====
        function createExplosion(x, y, size = 20, isEnemy = true) {
            playSound('explosion');

            // Screen shake based on explosion size
            const shakeIntensity = Math.min(size / 3, 10);
            addScreenShake(shakeIntensity, 10);

            // Screen flash for big explosions
            if (size > 25) {
                addScreenFlash(COLORS.explosion1, 0.2, 8);
            }

            // Create multiple particle rings for better explosion effect
            const particleCount = size * 2;
            const rings = 3;

            for (let ring = 0; ring < rings; ring++) {
                const ringDelay = ring * 3;
                const ringSpeed = (rings - ring) * 1.5;

                for (let i = 0; i < particleCount / rings; i++) {
                    const angle = (Math.PI * 2 * i) / (particleCount / rings) + Math.random() * 0.3;
                    const speed = Math.random() * ringSpeed + ringSpeed;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;

                    // Color progression: orange -> yellow -> white
                    const colors = [COLORS.explosion1, COLORS.explosion2, COLORS.explosion3];
                    const color = colors[ring % colors.length];
                    const particleSize = 4 - ring;

                    particles.push(new Particle(x, y, color, vx, vy, 40 + Math.random() * 20 - ringDelay, particleSize));
                }
            }

            // Add bright core flash
            particles.push(new Particle(x, y, '#ffffff', 0, 0, 15, size / 2));
        }

        // ===== FORMATION SYSTEM =====
        function createFormation(stage) {
            enemies = [];
            const formationStartY = 100;
            const spacingX = 60;
            const spacingY = 50;
            const formationStartX = GAME_WIDTH / 2 - (4 * spacingX) / 2;

            // Row 1: Bosses
            const bossCount = stage >= 10 ? 6 : 4;
            for (let i = 0; i < bossCount; i++) {
                const x = formationStartX + i * spacingX;
                const y = formationStartY;
                enemies.push(new Enemy('boss', x, y, i, 0));
            }

            // Row 2: Butterflies
            for (let i = 0; i < 6; i++) {
                const x = formationStartX + i * spacingX;
                const y = formationStartY + spacingY;
                enemies.push(new Enemy('butterfly', x, y, i, 1));
            }

            // Row 3: Dragonflies
            for (let i = 0; i < 6; i++) {
                const x = formationStartX + i * spacingX;
                const y = formationStartY + spacingY * 2;
                enemies.push(new Enemy('dragonfly', x, y, i, 2));
            }

            // Rows 4-5: Bees
            for (let row = 0; row < 2; row++) {
                for (let i = 0; i < 8; i++) {
                    const x = formationStartX - spacingX + i * spacingX;
                    const y = formationStartY + spacingY * (3 + row);
                    enemies.push(new Enemy('bee', x, y, i, 3 + row));
                }
            }
        }

        // ===== DIVE ATTACK AI =====
        let lastDiveTime = 0;
        function updateDiveAttacks() {
            const now = Date.now();
            const diveFrequency = Math.max(1000, 4000 - currentStage * 100);

            if (now - lastDiveTime > diveFrequency) {
                const formationEnemies = enemies.filter(e => e.state === 'FORMATION' && e.active);
                if (formationEnemies.length > 0) {
                    const randomEnemy = formationEnemies[Math.floor(Math.random() * formationEnemies.length)];
                    randomEnemy.startDive();
                    lastDiveTime = now;
                }
            }
        }

        // ===== COLLISION DETECTION =====
        function checkCollisions() {
            // Player bullets vs enemies
            bullets.forEach(bullet => {
                if (!bullet.active || bullet.isEnemy) return;

                enemies.forEach(enemy => {
                    if (!enemy.active) return;

                    if (bullet.collidesWith(enemy)) {
                        bullet.active = false;

                        // Hit flash before destruction
                        enemy.hitFlash = 10;

                        // Delayed destruction for hit flash effect
                        setTimeout(() => {
                            if (!enemy.active) return; // Already destroyed
                            enemy.active = false;

                            // Award points
                            const points = enemy.diving ? enemy.pointsDiving : enemy.pointsFormation;
                            let multiplier = dualFighterActive ? 1.5 : 1;

                            // Combo multiplier
                            if (comboCount > 5) multiplier *= 1.2;
                            if (comboCount > 10) multiplier *= 1.5;

                            const finalPoints = Math.floor(points * multiplier);
                            addScore(finalPoints);

                            // Show points gained
                            showFloatingText(enemy.x, enemy.y, `+${finalPoints}`, COLORS.scoreBonus, 1.2);

                            // Add to combo
                            addComboKill();

                            // Check if enemy had captured ship
                            if (enemy.capturedShip) {
                                // Rescue!
                                rescueCapturedShip();
                                addScore(1000);
                                showFloatingText(enemy.x, enemy.y - 30, 'RESCUED!', COLORS.perfect, 1.5);
                            }

                            // Create explosion with size based on enemy type
                            const explosionSize = enemy.type === 'boss' ? 30 : 20;
                            createExplosion(enemy.x, enemy.y, explosionSize);
                        }, 50); // 50ms delay for hit flash
                    }
                });
            });

            // Enemy collision with player
            if (player) {
                enemies.forEach(enemy => {
                    if (!enemy.active) return;

                    if (enemy.collidesWith(player)) {
                        playerHit();
                    }

                    // Check tractor beam collision
                    if (enemy.tractorBeamActive && !capturedShip) {
                        const beamLeft = enemy.x - 25;
                        const beamRight = enemy.x + 25;
                        const beamTop = enemy.y + 20;
                        const beamBottom = enemy.y + 220;

                        if (player.x > beamLeft && player.x < beamRight &&
                            player.y > beamTop && player.y < beamBottom) {
                            capturePlayer(enemy);
                        }
                    }
                });
            }
        }

        // ===== PLAYER HIT =====
        function playerHit() {
            lives--;
            hitsTaken++; // Track for perfect clear
            createExplosion(player.x, player.y, 30);
            addScreenShake(15, 25); // BIG shake on death

            if (dualFighterActive) {
                dualFighterActive = false;
            }

            if (lives <= 0) {
                gameState = 'GAME_OVER';
                player = null;
            } else {
                // Respawn player
                setTimeout(() => {
                    if (gameState === 'PLAYING') {
                        player = new Player(GAME_WIDTH / 2, GAME_HEIGHT - 80);
                    }
                }, 2000);
                player = null;
            }
        }

        // ===== CAPTURE MECHANICS =====
        function capturePlayer(capturingBoss) {
            playSound('tractorBeam');
            hitsTaken++; // Count capture as a hit
            capturedShip = {
                boss: capturingBoss,
                x: player.x,
                y: player.y
            };
            capturingBoss.capturedShip = capturedShip;

            lives--;
            addScreenShake(10, 20);

            if (lives <= 0) {
                gameState = 'GAME_OVER';
            }

            // Respawn player after delay
            setTimeout(() => {
                if (gameState === 'PLAYING') {
                    player = new Player(GAME_WIDTH / 2, GAME_HEIGHT - 80);
                }
            }, 2000);
            player = null;
        }

        function rescueCapturedShip() {
            if (capturedShip) {
                dualFighterActive = true;
                capturedShip = null;
                playSound('extraLife');
            }
        }

        // ===== SCORE SYSTEM =====
        function addScore(points) {
            score += points;

            // Check for extra life
            if (score >= extraLifeThreshold) {
                extraLifeThreshold += 10000;
                if (lives < 5) {
                    lives++;
                    playSound('extraLife');
                    showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2, '+1 LIFE', COLORS.scoreBonus);
                }
            }

            // Update high score
            if (score > highScore) {
                highScore = score;
                saveHighScore();
            }
        }

        // ===== FLOATING TEXT =====
        let floatingTexts = [];
        function showFloatingText(x, y, text, color, scale = 1) {

                x: x,
                y: y,
                text: text,
                color: color,
                life: 60,
                vy: -1,
                scale: scale
            });
        }

        function updateFloatingTexts() {
            floatingTexts.forEach(ft => {
                ft.y += ft.vy;
                ft.life--;
            });
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);
        }

        function drawFloatingTexts() {

                ctx.font = `bold ${fontSize}px "Courier New"`;

                ctx.shadowColor = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);

                ctx.globalAlpha = 1;

            if (leaderboard.length > 0) {

        function checkHighScore() {
            // Check if score qualifies for top 10
            if (leaderboard.length < 10 || score > leaderboard[leaderboard.length - 1].score) {
                // Find rank
                let rank = 0;
                for (let i = 0; i < leaderboard.length; i++) {
                    if (score > leaderboard[i].score) {
                        rank = i;
                        break;
                    }
                    rank = i + 1;
                }
                nameEntryData.rank = rank;
                nameEntryData.name = ['A', 'A', 'A'];
                nameEntryData.position = 0;
                gameState = 'NAME_ENTRY';
                return true;

            return false;

            loadLeaderboard(); // Refresh high score

        // ===== CAET QUESTION SYSTEM =====
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let selectedAnswer = 0;
        let questionTimer = 0;
        let questionStartTime = 0;
        let correctCount = 0;

        function startQuestions() {
            gameState = 'QUESTIONS';
            currentQuestions = generateQuestions(5);
            currentQuestionIndex = 0;
            selectedAnswer = 0;
            correctCount = 0;
            questionStartTime = Date.now();
            questionTimer = 20;
        }

        function generateQuestions(count) {
            const categories = Object.keys(caetQuestions);
            const questions = [];

            for (let i = 0; i < count; i++) {
                const category = categories[i % categories.length];
                const categoryQuestions = caetQuestions[category];
                const randomQ = categoryQuestions[Math.floor(Math.random() * categoryQuestions.length)];
                questions.push({
                    ...randomQ,
                    category: category
                });
            }

            return questions;
        }

        function updateQuestions() {
            // Update timer
            const elapsed = (Date.now() - questionStartTime) / 1000;
            questionTimer = Math.max(0, 20 - Math.floor(elapsed));

            if (questionTimer === 0) {
                // Timeout - treat as wrong answer
                handleAnswer(false);
            }

            // Handle input
            if (keys['ArrowUp']) {
                selectedAnswer = Math.max(0, selectedAnswer - 1);
                keys['ArrowUp'] = false;
            }
            if (keys['ArrowDown']) {
                selectedAnswer = Math.min(3, selectedAnswer + 1);
                keys['ArrowDown'] = false;
            }
            if (keys[' '] || keys['Enter']) {
                const currentQ = currentQuestions[currentQuestionIndex];
                const isCorrect = selectedAnswer === currentQ.correct;
                handleAnswer(isCorrect);
                keys[' '] = false;
                keys['Enter'] = false;
            }
        }

        function handleAnswer(isCorrect) {
            if (isCorrect) {
                addScore(500);
                correctCount++;
                playSound('correct');
                showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2, '+500', COLORS.scoreBonus);
            } else {
                score = Math.max(0, score - 200);
                playSound('wrong');
            }

            currentQuestionIndex++;

            if (currentQuestionIndex >= currentQuestions.length) {
                // All questions answered
                if (correctCount === currentQuestions.length) {
                    // Perfect! Bonus
                    addScore(2000);
                    showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2 + 40, 'PERFECT +2000', COLORS.perfect);
                }

                // Check for bonus stage
                if (currentStage % 3 === 0) {
                    startBonusStage();
                } else {
                    nextStage();
                }
            } else {
                // Next question
                selectedAnswer = 0;
                questionStartTime = Date.now();
                questionTimer = 20;
            }
        }

        function drawQuestions() {
            const currentQ = currentQuestions[currentQuestionIndex];

            // Background overlay
            ctx.fillStyle = 'rgba(10, 10, 46, 0.9)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Question box
            const boxX = 100;
            const boxY = 150;
            const boxWidth = GAME_WIDTH - 200;
            const boxHeight = 300;

            ctx.strokeStyle = COLORS.hudText;
            ctx.lineWidth = 3;
            ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

            // Category and timer
            ctx.fillStyle = COLORS.hudText;
            ctx.font = 'bold 16px "Courier New"';
            ctx.textAlign = 'left';
            ctx.fillText(`[CATEGORY: ${formatCategory(currentQ.category)}]`, boxX + 20, boxY + 30);

            ctx.textAlign = 'right';
            ctx.fillStyle = questionTimer < 5 ? COLORS.warning : COLORS.hudText;
            ctx.fillText(`TIME: ${questionTimer}s`, boxX + boxWidth - 20, boxY + 30);

            // Question text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px "Courier New"';
            ctx.textAlign = 'left';
            wrapText(ctx, currentQ.question, boxX + 20, boxY + 70, boxWidth - 40, 24);

            // Answers
            ctx.font = 'bold 16px "Courier New"';
            const answerY = boxY + 140;
            const letters = ['A', 'B', 'C', 'D'];

            currentQ.answers.forEach((answer, index) => {
                const y = answerY + index * 30;
                const isSelected = index === selectedAnswer;

                if (isSelected) {
                    ctx.fillStyle = COLORS.scoreBonus;
                    ctx.fillRect(boxX + 15, y - 18, boxWidth - 30, 25);
                    ctx.fillStyle = '#000000';
                } else {
                    ctx.fillStyle = '#ffffff';
                }

                ctx.fillText(`[${letters[index]}] ${answer}`, boxX + 25, y);
            });

            // Bonus info
            ctx.fillStyle = COLORS.scoreBonus;
            ctx.font = 'bold 14px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('SCORE BONUS: +500 pts', GAME_WIDTH / 2, boxY + boxHeight - 20);

            // Progress
            ctx.fillText(`Question ${currentQuestionIndex + 1} / ${currentQuestions.length}`, GAME_WIDTH / 2, boxY - 20);
        }

        function formatCategory(category) {
            return category.replace(/([A-Z])/g, ' $1').trim().toUpperCase();
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let lineY = y;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                const testWidth = metrics.width;

                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, lineY);
                    line = words[n] + ' ';
                    lineY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, lineY);
        }

        // ===== BONUS STAGE =====
        let bonusStageTimer = 0;
        let bonusEnemiesDestroyed = 0;

        function startBonusStage() {
            gameState = 'BONUS';
            bonusStageTimer = 40 * 60; // 40 seconds at 60 FPS

                const types = ['bee', 'butterfly', 'dragonfly'];
                const type = types[i % types.length];
                const enemy = new Enemy(type, x, y, i, 0);
                enemy.state = 'BONUS';
                enemy.bonusVx = 3;
                enemies.push(enemy);
            }

            showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 3, '*** CHALLENGING STAGE ***', COLORS.perfect);
        }

            bonusStageTimer--;

            // Move enemies in pattern
            enemies.forEach(enemy => {
                enemy.x += enemy.bonusVx;
                enemy.y += Math.sin(frameCount * 0.05) * 2;

                if (enemy.x > GAME_WIDTH + 50) {
                    enemy.x = -50;
                }
            });

            if (bonusStageTimer <= 0 || enemies.filter(e => e.active).length === 0) {
                // Bonus stage complete
                if (enemies.filter(e => !e.active).length === 20) {
                    addScore(10000);
                    showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2, 'PERFECT +10000', COLORS.perfect);

                nextStage();
