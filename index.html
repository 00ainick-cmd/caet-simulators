<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANGAR DEFENDER - Aviation CAET Study Game</title>
    <style>
        /* ===== IMPORT RETRO FONT ===== */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        /* ===== SEGA GENESIS AESTHETIC ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Orbitron', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        #gameContainer {
            position: relative;
            width: 450px;
            height: 600px;
            background: #0a0a2e;
            border: 4px solid #00ff41;
            box-shadow: 0 0 20px #00ff41, inset 0 0 40px rgba(0, 255, 65, 0.1);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* CRT Scanlines Effect */
        #gameContainer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 1px,
                rgba(0, 0, 0, 0.5) 1px,
                rgba(0, 0, 0, 0.5) 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* CRT Screen Curvature */
        #gameContainer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center,
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 11;
        }

        /* Glow effect for high-contrast elements */
        .glow {
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
        }

        /* Loading screen */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ff41;
            font-size: 24px;
            z-index: 100;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .blink {
            animation: blink 1s infinite;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="450" height="600"></canvas>
        <div id="loadingScreen">
            <div class="glow">HANGAR DEFENDER</div>
            <div style="margin-top: 20px; font-size: 16px;">INITIALIZING SYSTEMS...</div>
            <div class="blink" style="margin-top: 20px; font-size: 14px;">PRESS SPACE TO START</div>
        </div>
    </div>

    <script>
        // ============================================
        // HANGAR DEFENDER - GALAGA CLONE
        // Aviation CAET Study Game
        // Sega Genesis Aesthetic
        // ============================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const loadingScreen = document.getElementById('loadingScreen');

        // ===== GAME CONSTANTS =====
        const GAME_WIDTH = 450;
        const GAME_HEIGHT = 600;
        const FPS = 60;
        const FRAME_TIME = 1000 / FPS;

        // ===== COLOR PALETTE (16-BIT SEGA GENESIS) =====
        const COLORS = {
            background: '#0a0a2e',
            player: '#00ffff',
            boss: '#3366ff',
            butterfly: '#ff3366',
            dragonfly: '#33ff66',
            bee: '#ffff33',
            bullet: '#00ff00',
            tractorBeam: '#66ccff',
            hudText: '#00ff41',
            explosion1: '#ff6600',
            explosion2: '#ffff00',
            explosion3: '#ffffff',
            scoreBonus: '#ffff00',
            warning: '#ff0000',
            perfect: '#ff00ff'
        };

        // ===== GAME STATE =====
        let gameState = 'MENU'; // MENU, ATTRACT, PLAYING, PAUSED, GAME_OVER, QUESTIONS, BONUS, NAME_ENTRY
        let currentStage = 1;
        let score = 0;
        let highScore = 0;
        let lives = 3;
        let extraLifeThreshold = 10000;
        let lastFrameTime = 0;
        let keys = {};
        let frameCount = 0;

        // ===== KONAMI CODE =====
        let konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
        let konamiProgress = 0;
        let konamiActivated = false;
        let easterEggMode = false;

        // ===== TIMER MANAGEMENT (prevents memory leaks) =====
        let respawnTimer = null;
        let rapidFireTimer = null;
        let playerHitCooldown = false; // Prevents multiple hits in same frame

        // ===== ENTITY ARRAYS =====
        let player = null;
        let capturedShip = null;
        let dualFighterActive = false;
        let enemies = [];
        let bullets = [];
        let particles = [];
        let stars = [];
        let powerUps = [];

        // ===== GAME SETTINGS =====
        let settings = {
            soundEnabled: true,
            musicEnabled: true
        };

        // ===== PLAYER CLASS =====
        class Player {
            constructor(x, y, isDual = false) {
                this.x = x;
                this.y = y;
                this.width = 32; // Reduced from 40 for better collision detection
                this.height = 32; // Reduced from 40 for better collision detection
                this.speed = 5;
                this.shootCooldown = 0;
                this.shootCooldownTime = 250; // ms
                this.lastShot = 0;
                this.isDual = isDual;
                this.color = COLORS.player;
                this.engineGlow = 0;

                // Invincibility system
                this.invincible = true;
                this.invincibilityTime = 3000; // 3 seconds of invincibility
                this.spawnTime = Date.now();
                this.blinkRate = 100; // Blink every 100ms during invincibility
            }

            update(deltaTime) {
                // Update invincibility
                if (this.invincible) {
                    if (Date.now() - this.spawnTime > this.invincibilityTime) {
                        this.invincible = false;
                    }
                }

                // Movement
                if (keys['ArrowLeft'] && this.x > this.width / 2) {
                    this.x -= this.speed;
                }
                if (keys['ArrowRight'] && this.x < GAME_WIDTH - this.width / 2) {
                    this.x += this.speed;
                }

                // Shooting
                if ((keys[' '] || keys['Enter']) && Date.now() - this.lastShot > this.shootCooldownTime) {
                    this.shoot();
                    this.lastShot = Date.now();
                    playSound('shoot');
                }

                // Engine glow animation
                this.engineGlow = (this.engineGlow + 0.1) % (Math.PI * 2);
            }

            shoot() {
                if (this.isDual) {
                    // Dual fighter shoots two bullets
                    bullets.push(new Bullet(this.x - 15, this.y - 20));
                    bullets.push(new Bullet(this.x + 15, this.y - 20));
                } else {
                    bullets.push(new Bullet(this.x, this.y - 20));
                }
            }

            draw() {
                // Blinking effect during invincibility
                if (this.invincible) {
                    const blinkPhase = Math.floor(Date.now() / this.blinkRate) % 2;
                    if (blinkPhase === 0) {
                        ctx.globalAlpha = 0.3; // Semi-transparent during blink
                    }
                }

                ctx.save();
                ctx.translate(this.x, this.y);

                // Draw player ship (classic fighter jet from top-down view)
                // Body
                ctx.fillStyle = COLORS.player;
                ctx.beginPath();
                ctx.moveTo(0, -20); // Nose
                ctx.lineTo(-8, 0); // Left wing
                ctx.lineTo(-6, 10); // Left tail
                ctx.lineTo(6, 10); // Right tail
                ctx.lineTo(8, 0); // Right wing
                ctx.closePath();
                ctx.fill();

                // Cockpit
                ctx.fillStyle = '#ffff33';
                ctx.beginPath();
                ctx.arc(0, -5, 4, 0, Math.PI * 2);
                ctx.fill();

                // Engine glow
                const glowAlpha = 0.5 + Math.sin(this.engineGlow) * 0.3;
                ctx.fillStyle = `rgba(0, 255, 255, ${glowAlpha})`;
                ctx.beginPath();
                ctx.arc(-6, 10, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(6, 10, 3, 0, Math.PI * 2);
                ctx.fill();

                // Glow effect
                ctx.shadowBlur = 10;
                ctx.shadowColor = COLORS.player;

                ctx.restore();

                // Reset alpha after invincibility blink
                ctx.globalAlpha = 1.0;
            }
        }

        // ===== BULLET CLASS =====
        class Bullet {
            constructor(x, y, speed = 8, color = COLORS.bullet, isEnemy = false) {
                this.x = x;
                this.y = y;
                this.width = 4;
                this.height = 12;
                this.speed = speed;
                this.color = color;
                this.isEnemy = isEnemy;
                this.active = true;
                this.rainbowHue = Math.random() * 360;
            }

            update() {
                if (this.isEnemy) {
                    this.y += this.speed;
                } else {
                    this.y -= this.speed;
                }

                // Update rainbow effect in konami mode
                if (easterEggMode && !this.isEnemy) {
                    this.rainbowHue = (this.rainbowHue + 5) % 360;
                }

                // Remove if off screen
                if (this.y < 0 || this.y > GAME_HEIGHT) {
                    this.active = false;
                }
            }

            draw() {
                // Rainbow bullets in konami mode
                if (easterEggMode && !this.isEnemy) {
                    ctx.fillStyle = `hsl(${this.rainbowHue}, 100%, 50%)`;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = `hsl(${this.rainbowHue}, 100%, 50%)`;
                } else {
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                }
                ctx.fillRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);
                ctx.shadowBlur = 0;
            }

            collidesWith(entity) {
                return this.x < entity.x + entity.width / 2 &&
                       this.x > entity.x - entity.width / 2 &&
                       this.y < entity.y + entity.height / 2 &&
                       this.y > entity.y - entity.height / 2;
            }
        }

        // ===== ENEMY CLASS =====
        class Enemy {
            constructor(type, formationX, formationY, gridX, gridY) {
                this.type = type; // 'boss', 'butterfly', 'dragonfly', 'bee', 'capture'
                this.formationX = formationX;
                this.formationY = formationY;
                this.gridX = gridX;
                this.gridY = gridY;
                this.x = formationX;
                this.y = -50; // Start above screen
                this.vx = 0;
                this.vy = 0;
                this.state = 'ENTERING'; // ENTERING, FORMATION, DIVING, RETURNING, LOOPING
                this.active = true;
                this.diving = false;
                this.diveProgress = 0;
                this.divePattern = null;
                this.diveBombCount = 0; // How many times to dive before returning
                this.currentDive = 0; // Current dive number
                this.capturedShip = null;
                this.tractorBeamActive = false;
                this.tractorBeamProgress = 0;
                this.tractorBeamTimer = 0;
                this.animFrame = 0;
                this.animSpeed = 0.1;

                // Enemy shooting
                this.canShoot = Math.random() < 0.3; // 30% of enemies can shoot
                this.lastShot = Date.now();
                this.shootCooldown = 2000 + Math.random() * 2000; // 2-4 seconds between shots

                // Set properties based on type
                this.setupType();
            }

            setupType() {
                switch(this.type) {
                    case 'boss':
                        this.width = 28;
                        this.height = 28;
                        this.color = COLORS.boss;
                        this.pointsFormation = 150;
                        this.pointsDiving = 400;
                        this.speed = 1.3; // More agile
                        break;
                    case 'capture':
                        this.width = 32;
                        this.height = 32;
                        this.color = '#ff00ff'; // Purple/magenta for capture aliens
                        this.pointsFormation = 200;
                        this.pointsDiving = 800;
                        this.speed = 1.0;
                        this.canCapture = true;
                        break;
                    case 'butterfly':
                        this.width = 32;
                        this.height = 32;
                        this.color = COLORS.butterfly;
                        this.pointsFormation = 80;
                        this.pointsDiving = 160;
                        this.speed = 1.0;
                        break;
                    case 'dragonfly':
                        this.width = 30;
                        this.height = 30;
                        this.color = COLORS.dragonfly;
                        this.pointsFormation = 100;
                        this.pointsDiving = 160;
                        this.speed = 1.0;
                        break;
                    case 'bee':
                        this.width = 24;
                        this.height = 24;
                        this.color = COLORS.bee;
                        this.pointsFormation = 50;
                        this.pointsDiving = 100;
                        this.speed = 1.0;
                        break;
                }
            }

            update(formationOffsetX = 0) {
                this.animFrame += this.animSpeed;

                // Enemy shooting logic (only during DIVING or FORMATION if in range)
                if (this.canShoot && player && !player.invincible && (gameState === 'PLAYING' || gameState === 'BONUS')) {
                    const now = Date.now();
                    if (now - this.lastShot > this.shootCooldown) {
                        // Only shoot if in diving state or in formation and player is somewhat aligned
                        if (this.state === 'DIVING' ||
                           (this.state === 'FORMATION' && Math.abs(this.x - player.x) < 100)) {
                            this.shoot();
                            this.lastShot = now;
                        }
                    }
                }

                switch(this.state) {
                    case 'ENTERING':
                        // Move to formation position
                        const dx = this.formationX + formationOffsetX - this.x;
                        const dy = this.formationY - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 5) {
                            this.state = 'FORMATION';
                            this.x = this.formationX + formationOffsetX;
                            this.y = this.formationY;
                        } else {
                            this.x += dx * 0.05;
                            this.y += dy * 0.05;
                        }
                        break;

                    case 'FORMATION':
                        // Idle in formation with slow horizontal movement
                        // Constrain to screen bounds to prevent off-screen positioning
                        this.x = this.formationX + formationOffsetX;
                        this.x = Math.max(this.width / 2 + 10, Math.min(GAME_WIDTH - this.width / 2 - 10, this.x));
                        break;

                    case 'DIVING':
                        this.executeDive();
                        break;

                    case 'LOOPING':
                        // Loop back up outside play area
                        this.y -= 8; // Move up quickly outside screen

                        // When above screen, check if should dive again or return
                        if (this.y < -50) {
                            this.currentDive++;
                            if (this.currentDive < this.diveBombCount) {
                                // Dive again! Reset position to side
                                this.x = this.x < GAME_WIDTH / 2 ? -50 : GAME_WIDTH + 50;
                                this.y = GAME_HEIGHT / 2;
                                this.state = 'DIVING';
                                this.diveProgress = 0;
                            } else {
                                // Done diving, return to formation
                                this.state = 'RETURNING';
                                this.currentDive = 0;
                            }
                        }
                        break;

                    case 'RETURNING':
                        // Return to formation (outside visible area)
                        const rdx = this.formationX + formationOffsetX - this.x;
                        const rdy = this.formationY - this.y;
                        const rdist = Math.sqrt(rdx * rdx + rdy * rdy);

                        if (rdist < 5) {
                            this.state = 'FORMATION';
                            this.diving = false;
                        } else {
                            this.x += rdx * 0.05;
                            this.y += rdy * 0.05;
                        }
                        break;
                }

                // Update tractor beam
                if (this.tractorBeamActive) {
                    this.tractorBeamTimer++;
                    this.tractorBeamProgress += 0.1;

                    // Turn off after 1 second (60 frames)
                    if (this.tractorBeamTimer > 60) {
                        this.tractorBeamActive = false;
                        this.tractorBeamProgress = 0;
                        this.tractorBeamTimer = 0;
                        // Return to formation after tractor beam
                        if (this.state === 'DIVING') {
                            this.state = 'RETURNING';
                        }
                    }
                }
            }

            startDive() {
                if (this.state === 'FORMATION' && !this.diving) {
                    this.state = 'DIVING';
                    this.diving = true;
                    this.diveProgress = 0;
                    this.currentDive = 0;

                    // Some enemies do divebomb patterns (dive multiple times)
                    if (Math.random() < 0.3) { // 30% chance
                        this.diveBombCount = Math.floor(Math.random() * 2) + 2; // 2-3 dives
                    } else {
                        this.diveBombCount = 1; // Single dive
                    }

                    // Capture enemies have chance to activate tractor beam
                    if (this.type === 'capture' && Math.random() < 0.25) {
                        this.shouldUseTractorBeam = true;
                    } else {
                        this.shouldUseTractorBeam = false;
                    }
                }
            }

            executeDive() {
                // Special handling for capture enemies with tractor beam
                if (this.type === 'capture' && this.shouldUseTractorBeam && !this.tractorBeamActive) {
                    // Dive down toward player area
                    const targetY = GAME_HEIGHT - 200; // Stop above player
                    const targetX = player ? player.x : GAME_WIDTH / 2;

                    // Move toward target position
                    const dx = targetX - this.x;
                    const dy = targetY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 20) {
                        // Reached position, activate tractor beam
                        this.tractorBeamActive = true;
                        this.tractorBeamTimer = 0;
                        playSound('tractorBeam');
                    } else {
                        // Move toward target
                        this.x += dx * 0.05;
                        this.y += dy * 0.05;
                    }
                    return; // Don't use normal dive pattern
                }

                this.diveProgress += 0.02 * (this.speed || 1.0);

                const centerX = GAME_WIDTH / 2;
                const centerY = GAME_HEIGHT / 2;

                switch(this.type) {
                    case 'boss':
                        // Faster, more aggressive arc
                        const t = this.diveProgress;
                        this.x = this.formationX + Math.sin(t * Math.PI) * 100;
                        this.y = this.formationY + t * 500;
                        break;

                    case 'capture':
                        // Gentle arc toward center
                        const ct = this.diveProgress;
                        this.x = this.formationX + Math.sin(ct * Math.PI) * 120;
                        this.y = this.formationY + ct * 420;
                        break;

                    case 'butterfly':
                        // Figure-8 swoop
                        const bt = this.diveProgress * Math.PI * 2;
                        this.x = this.formationX + Math.sin(bt) * 80;
                        this.y = this.formationY + this.diveProgress * 380 + Math.sin(bt * 2) * 40;
                        break;

                    case 'bee':
                        // Fast straight dive
                        this.y = this.formationY + this.diveProgress * 520;
                        this.x += (player && player.x ? (player.x - this.x) * 0.015 : 0);
                        break;

                    case 'dragonfly':
                        // Wide looping pattern
                        const dt = this.diveProgress * Math.PI;
                        this.x = this.formationX + Math.cos(dt) * 90;
                        this.y = this.formationY + this.diveProgress * 400;
                        break;
                }

                // Check if dive complete - transition to LOOPING to go back up
                if (this.diveProgress >= 1 || this.y > GAME_HEIGHT + 50) {
                    this.state = 'LOOPING';
                    this.tractorBeamActive = false;
                    this.shouldUseTractorBeam = false;
                }
            }

            shoot() {
                // Enemy shoots bullet toward player
                if (player && this.y < GAME_HEIGHT - 50) { // Don't shoot if too low
                    bullets.push(new Bullet(this.x, this.y + 10, 4, '#ff6600', true));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Draw enemy based on type
                switch(this.type) {
                    case 'boss':
                        this.drawBoss();
                        break;
                    case 'capture':
                        this.drawCapture();
                        break;
                    case 'butterfly':
                        this.drawButterfly();
                        break;
                    case 'dragonfly':
                        this.drawDragonfly();
                        break;
                    case 'bee':
                        this.drawBee();
                        break;
                }

                // Draw tractor beam if active
                if (this.tractorBeamActive) {
                    this.drawTractorBeam();
                }

                ctx.restore();

                // Draw captured ship if exists
                if (this.capturedShip) {
                    ctx.save();
                    ctx.translate(this.x, this.y + 50);
                    ctx.globalAlpha = 0.7;
                    this.drawCapturedShip();
                    ctx.restore();
                }
            }

            drawBoss() {
                // Smaller, more agile bug
                const wingSpan = Math.sin(this.animFrame) * 2;

                ctx.fillStyle = this.color;
                // Body (smaller)
                ctx.beginPath();
                ctx.ellipse(0, 0, 10, 14, 0, 0, Math.PI * 2);
                ctx.fill();

                // Wings (smaller)
                ctx.beginPath();
                ctx.ellipse(-8 - wingSpan, -3, 6, 10, -0.3, 0, Math.PI * 2);
                ctx.ellipse(8 + wingSpan, -3, 6, 10, 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Circuit pattern
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-6, -7);
                ctx.lineTo(6, -7);
                ctx.moveTo(0, -7);
                ctx.lineTo(0, 7);
                ctx.stroke();

                // Eyes
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(-3, -3, 2, 0, Math.PI * 2);
                ctx.arc(3, -3, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            drawCapture() {
                // Special capture enemy - larger with pulsing effect
                const pulse = Math.sin(this.animFrame) * 2;
                const wingSpan = Math.sin(this.animFrame * 1.5) * 4;

                ctx.fillStyle = this.color;

                // Main body - larger and more imposing
                ctx.beginPath();
                ctx.ellipse(0, 0, 14 + pulse, 16 + pulse, 0, 0, Math.PI * 2);
                ctx.fill();

                // Large wings
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                ctx.ellipse(-14 - wingSpan, -4, 10, 14, -0.4, 0, Math.PI * 2);
                ctx.ellipse(14 + wingSpan, -4, 10, 14, 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                // Glowing "antenna" for tractor beam
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-4, -10);
                ctx.lineTo(-6, -16);
                ctx.moveTo(4, -10);
                ctx.lineTo(6, -16);
                ctx.stroke();

                // Glowing tips
                ctx.fillStyle = '#66ccff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#66ccff';
                ctx.beginPath();
                ctx.arc(-6, -16, 3, 0, Math.PI * 2);
                ctx.arc(6, -16, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Eyes - more menacing
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(-5, -3, 3, 0, Math.PI * 2);
                ctx.arc(5, -3, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(-5, -3, 1.5, 0, Math.PI * 2);
                ctx.arc(5, -3, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            drawButterfly() {
                // Medium alien with spread wings
                const wingFlap = Math.sin(this.animFrame) * 4;

                ctx.fillStyle = this.color;
                // Body
                ctx.fillRect(-4, -10, 8, 20);

                // Wings
                ctx.beginPath();
                ctx.moveTo(-4, 0);
                ctx.quadraticCurveTo(-15 - wingFlap, -10, -12 - wingFlap, -18);
                ctx.quadraticCurveTo(-8, -15, -4, -5);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(4, 0);
                ctx.quadraticCurveTo(15 + wingFlap, -10, 12 + wingFlap, -18);
                ctx.quadraticCurveTo(8, -15, 4, -5);
                ctx.fill();

                // Wire traces
                ctx.strokeStyle = '#ff6699';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-10, -15);
                ctx.lineTo(10, -15);
                ctx.stroke();
            }

            drawDragonfly() {
                // Elongated body with antenna
                ctx.fillStyle = this.color;

                // Body segments
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.arc(0, -10 + i * 6, 6 - i * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Wings
                const wingAngle = Math.sin(this.animFrame) * 0.2;
                ctx.save();
                ctx.rotate(wingAngle);
                ctx.fillStyle = 'rgba(51, 255, 102, 0.5)';
                ctx.fillRect(-15, -8, 10, 3);
                ctx.fillRect(5, -8, 10, 3);
                ctx.restore();

                // Antenna
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-3, -12);
                ctx.lineTo(-5, -18);
                ctx.moveTo(3, -12);
                ctx.lineTo(5, -18);
                ctx.stroke();
            }

            drawBee() {
                // Small compact wasp
                ctx.fillStyle = this.color;

                // Body
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();

                // Stripes
                ctx.fillStyle = '#000';
                ctx.fillRect(-8, -2, 16, 2);
                ctx.fillRect(-8, 2, 16, 2);

                // Stinger
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(-3, 8);
                ctx.lineTo(0, 12);
                ctx.lineTo(3, 8);
                ctx.fill();

                // Wings (subtle)
                const wingBuzz = Math.sin(this.animFrame * 2) * 2;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.ellipse(-6, -3 + wingBuzz, 4, 6, -0.5, 0, Math.PI * 2);
                ctx.ellipse(6, -3 + wingBuzz, 4, 6, 0.5, 0, Math.PI * 2);
                ctx.fill();
            }

            drawTractorBeam() {
                const beamWidth = 50;
                const beamHeight = 200;
                const pulse = Math.sin(this.tractorBeamProgress * 10) * 0.3 + 0.7;

                ctx.save();
                ctx.globalAlpha = 0.5 * pulse;

                // Beam gradient
                const gradient = ctx.createLinearGradient(0, 0, 0, beamHeight);
                gradient.addColorStop(0, COLORS.tractorBeam);
                gradient.addColorStop(1, 'rgba(102, 204, 255, 0)');

                ctx.fillStyle = gradient;
                ctx.fillRect(-beamWidth / 2, 20, beamWidth, beamHeight);

                // Beam particles
                for (let i = 0; i < 10; i++) {
                    const py = 20 + (this.tractorBeamProgress * beamHeight + i * 20) % beamHeight;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(Math.sin(i) * 20, py, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            drawCapturedShip() {
                // Draw mini player ship
                ctx.fillStyle = COLORS.player;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(-4, 0);
                ctx.lineTo(-3, 5);
                ctx.lineTo(3, 5);
                ctx.lineTo(4, 0);
                ctx.closePath();
                ctx.fill();
            }

            collidesWith(entity) {
                return Math.abs(this.x - entity.x) < (this.width + entity.width) / 2 &&
                       Math.abs(this.y - entity.y) < (this.height + entity.height) / 2;
            }
        }

        // ===== PARTICLE CLASS =====
        class Particle {
            constructor(x, y, color, vx, vy, life = 30) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.life = life;
                this.maxLife = life;
                this.size = 3;
                this.active = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                if (this.life <= 0) this.active = false;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        // ===== POWER-UP CLASS =====
        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'rapid', 'dual', 'shield', 'life'
                this.width = 24;
                this.height = 24;
                this.speed = 2;
                this.active = true;
                this.pulse = 0;
            }

            update() {
                this.y += this.speed;
                this.pulse += 0.1;

                // Remove if off screen
                if (this.y > GAME_HEIGHT + 50) {
                    this.active = false;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                const pulseSize = Math.sin(this.pulse) * 3;

                // Power-up box
                ctx.fillStyle = this.getColor();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.getColor();
                ctx.beginPath();
                ctx.arc(0, 0, 12 + pulseSize, 0, Math.PI * 2);
                ctx.fill();

                // Symbol
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.getSymbol(), 0, 0);

                ctx.shadowBlur = 0;
                ctx.restore();
            }

            getColor() {
                switch(this.type) {
                    case 'rapid': return '#ff6600';
                    case 'dual': return '#00ffff';
                    case 'shield': return '#ffff00';
                    case 'life': return '#ff00ff';
                    default: return '#ffffff';
                }
            }

            getSymbol() {
                switch(this.type) {
                    case 'rapid': return 'R';
                    case 'dual': return 'D';
                    case 'shield': return 'S';
                    case 'life': return '+';
                    default: return '?';
                }
            }

            collidesWith(entity) {
                return Math.abs(this.x - entity.x) < (this.width + entity.width) / 2 &&
                       Math.abs(this.y - entity.y) < (this.height + entity.height) / 2;
            }
        }

        // ===== STAR FIELD =====
        class Star {
            constructor() {
                this.x = Math.random() * GAME_WIDTH;
                this.y = Math.random() * GAME_HEIGHT;
                this.size = Math.random() * 2 + 1;
                this.speed = this.size * 0.5; // Parallax based on size
                this.brightness = Math.random() * 0.5 + 0.5;
                this.twinkle = Math.random() * Math.PI * 2;
            }

            update() {
                this.y += this.speed;
                if (this.y > GAME_HEIGHT) {
                    this.y = 0;
                    this.x = Math.random() * GAME_WIDTH;
                }
                this.twinkle += 0.05;
            }

            draw() {
                const alpha = this.brightness + Math.sin(this.twinkle) * 0.2;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.size > 2 ? '#66ccff' : '#ffffff';
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        // ===== SOUND SYSTEM (Web Audio API) =====
        let audioContext = null;
        let soundBuffers = {};

        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                console.log('Web Audio API not supported');
            }
        }

        function playSound(soundName) {
            if (!settings.soundEnabled || !audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Different sounds for different events
            switch(soundName) {
                case 'shoot':
                    oscillator.frequency.value = 800;
                    oscillator.type = 'square';
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.1);
                    break;

                case 'explosion':
                    oscillator.frequency.value = 200;
                    oscillator.type = 'sawtooth';
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.3);
                    break;

                case 'tractorBeam':
                    oscillator.frequency.value = 150;
                    oscillator.type = 'sine';
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 1);
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 1);
                    break;

                case 'extraLife':
                    oscillator.frequency.value = 1200;
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.2);
                    break;

                case 'correct':
                    oscillator.frequency.value = 1000;
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.15);
                    break;

                case 'wrong':
                    oscillator.frequency.value = 300;
                    oscillator.type = 'sawtooth';
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.4);
                    break;
            }
        }

        // ===== EXPLOSION EFFECT =====
        function createExplosion(x, y, size = 20) {
            playSound('explosion');

            // Create particle burst
            const particleCount = size;
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount;
                const speed = Math.random() * 3 + 2;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                const colors = [COLORS.explosion1, COLORS.explosion2, COLORS.explosion3];
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color, vx, vy, 30 + Math.random() * 20));
            }
        }

        // ===== FORMATION SYSTEM =====
        function createFormation(stage) {
            enemies = [];
            const formationStartY = 80;
            const spacingX = 38; // Reduced from 45 to fit better
            const spacingY = 42;
            const maxSwing = 20; // Maximum formation swing amount
            const safeMargin = 40; // Keep enemies this far from edges

            // Calculate max width to fit on screen with swing and margins
            const maxFormationWidth = GAME_WIDTH - (2 * safeMargin) - (2 * maxSwing);
            const maxEnemiesPerRow = Math.floor(maxFormationWidth / spacingX);

            // Start formation centered
            const formationCenterX = GAME_WIDTH / 2;

            // Row 1: Capture aliens (the ones with tractor beam)
            const captureCount = Math.min(3, stage >= 10 ? 3 : 2);
            const captureStartX = formationCenterX - ((captureCount - 1) * spacingX) / 2;
            for (let i = 0; i < captureCount; i++) {
                const x = captureStartX + i * spacingX;
                const y = formationStartY;
                enemies.push(new Enemy('capture', x, y, i, 0));
            }

            // Row 2: Bosses (smaller and more agile now)
            const bossCount = Math.min(maxEnemiesPerRow, stage >= 10 ? 6 : 4);
            const bossStartX = formationCenterX - ((bossCount - 1) * spacingX) / 2;
            for (let i = 0; i < bossCount; i++) {
                const x = bossStartX + i * spacingX;
                const y = formationStartY + spacingY;
                enemies.push(new Enemy('boss', x, y, i, 1));
            }

            // Row 3: Butterflies
            const butterflyCount = Math.min(maxEnemiesPerRow, 6);
            const butterflyStartX = formationCenterX - ((butterflyCount - 1) * spacingX) / 2;
            for (let i = 0; i < butterflyCount; i++) {
                const x = butterflyStartX + i * spacingX;
                const y = formationStartY + spacingY * 2;
                enemies.push(new Enemy('butterfly', x, y, i, 2));
            }

            // Row 4: Dragonflies
            const dragonflyCount = Math.min(maxEnemiesPerRow, 6);
            const dragonflyStartX = formationCenterX - ((dragonflyCount - 1) * spacingX) / 2;
            for (let i = 0; i < dragonflyCount; i++) {
                const x = dragonflyStartX + i * spacingX;
                const y = formationStartY + spacingY * 3;
                enemies.push(new Enemy('dragonfly', x, y, i, 3));
            }

            // Rows 5-7: Bees
            const beeCount = Math.min(maxEnemiesPerRow, 8);
            for (let row = 0; row < 3; row++) {
                const beeStartX = formationCenterX - ((beeCount - 1) * spacingX) / 2;
                for (let i = 0; i < beeCount; i++) {
                    const x = beeStartX + i * spacingX;
                    const y = formationStartY + spacingY * (4 + row);
                    enemies.push(new Enemy('bee', x, y, i, 4 + row));
                }
            }
        }

        // ===== DIVE ATTACK AI =====
        let lastDiveTime = 0;
        function updateDiveAttacks() {
            // Only attack during active gameplay
            if (gameState !== 'PLAYING' && gameState !== 'BONUS') {
                return;
            }

            const now = Date.now();
            // Better balanced difficulty curve
            const diveFrequency = Math.max(1500, 4000 - currentStage * 100);

            if (now - lastDiveTime > diveFrequency) {
                const formationEnemies = enemies.filter(e => e.state === 'FORMATION' && e.active);
                if (formationEnemies.length > 0) {
                    // Gradually increase attackers: 1 enemy until stage 5, then 1-2, then 1-3
                    let maxAttackers = 1;
                    if (currentStage >= 10) maxAttackers = 3;
                    else if (currentStage >= 5) maxAttackers = 2;

                    const numAttackers = Math.floor(Math.random() * maxAttackers) + 1;

                    for (let i = 0; i < numAttackers && i < formationEnemies.length; i++) {
                        const randomIndex = Math.floor(Math.random() * formationEnemies.length);
                        const randomEnemy = formationEnemies[randomIndex];
                        if (randomEnemy && randomEnemy.state === 'FORMATION') {
                            randomEnemy.startDive();
                            formationEnemies.splice(randomIndex, 1); // Remove from array so we don't pick same enemy
                        }
                    }
                    lastDiveTime = now;
                }
            }
        }

        // ===== POWER-UP SPAWNING =====
        function spawnPowerUp(x, y) {
            // 12% chance to drop a power-up when enemy is destroyed (balanced)
            if (Math.random() < 0.12) {
                const types = ['rapid', 'dual', 'life'];
                const type = types[Math.floor(Math.random() * types.length)];
                powerUps.push(new PowerUp(x, y, type));
            }
        }

        // ===== COLLISION DETECTION =====
        function checkCollisions() {
            // Player bullets vs enemies
            bullets.forEach(bullet => {
                if (!bullet.active || bullet.isEnemy) return;

                enemies.forEach(enemy => {
                    if (!enemy.active) return;

                    if (bullet.collidesWith(enemy)) {
                        bullet.active = false;
                        enemy.active = false;

                        // Award points
                        const points = enemy.diving ? enemy.pointsDiving : enemy.pointsFormation;
                        const multiplier = dualFighterActive ? 1.5 : 1;
                        addScore(Math.floor(points * multiplier));

                        // Check if enemy had captured ship
                        if (enemy.capturedShip) {
                            // Rescue!
                            rescueCapturedShip();
                            addScore(1000);
                        }

                        createExplosion(enemy.x, enemy.y, 20);

                        // Chance to spawn power-up
                        spawnPowerUp(enemy.x, enemy.y);
                    }
                });
            });

            // Enemy collision with player
            if (player && !player.invincible && !playerHitCooldown) {
                enemies.forEach(enemy => {
                    if (!enemy.active || !player || player.invincible || playerHitCooldown) return;

                    if (enemy.collidesWith(player)) {
                        // Destroy the enemy too
                        enemy.active = false;
                        createExplosion(enemy.x, enemy.y, 20);
                        // Player loses life
                        playerHit();
                        return; // Exit this iteration after player is hit
                    }

                    // Check tractor beam collision (only if player still exists and not invincible)
                    if (enemy.tractorBeamActive && !capturedShip && player && !player.invincible) {
                        const beamLeft = enemy.x - 25;
                        const beamRight = enemy.x + 25;
                        const beamTop = enemy.y + 20;
                        const beamBottom = enemy.y + 220;

                        if (player.x > beamLeft && player.x < beamRight &&
                            player.y > beamTop && player.y < beamBottom) {
                            capturePlayer(enemy);
                        }
                    }
                });

                // Enemy bullet collision with player
                bullets.forEach(bullet => {
                    if (bullet.isEnemy && bullet.active && player && !player.invincible && !playerHitCooldown) {
                        if (bullet.collidesWith(player)) {
                            bullet.active = false;
                            createExplosion(player.x, player.y, 15);
                            playerHit();
                        }
                    }
                });

                // Power-up collision with player (check player still exists)
                if (player) {
                    powerUps.forEach(powerUp => {
                        if (!powerUp.active || !player) return; // Check player exists each iteration

                        if (powerUp.collidesWith(player)) {
                            powerUp.active = false;
                            applyPowerUp(powerUp.type);
                            playSound('extraLife');
                        }
                    });
                }
            }
        }

        // ===== APPLY POWER-UP =====
        function applyPowerUp(type) {
            if (!player) return; // Safety check

            switch(type) {
                case 'life':
                    lives++;
                    addFloatingText(player.x, player.y, '+1 LIFE', COLORS.perfect);
                    break;
                case 'rapid':
                    // Clear any existing rapid fire timer
                    if (rapidFireTimer) {
                        clearTimeout(rapidFireTimer);
                        rapidFireTimer = null;
                    }

                    player.shootCooldownTime = 150; // Faster shooting
                    addFloatingText(player.x, player.y, 'RAPID FIRE!', COLORS.explosion1);

                    // Reset after 10 seconds
                    rapidFireTimer = setTimeout(() => {
                        if (player) player.shootCooldownTime = 250;
                        rapidFireTimer = null;
                    }, 10000);
                    break;
                case 'dual':
                    if (!dualFighterActive) {
                        dualFighterActive = true;
                        addFloatingText(player.x, player.y, 'DUAL FIGHTERS!', COLORS.player);
                    }
                    break;
            }
        }

        // ===== PLAYER HIT =====
        function playerHit() {
            if (!player || playerHitCooldown) return; // Safety check + prevent multiple hits

            // Set cooldown to prevent multiple hits in same frame
            playerHitCooldown = true;
            setTimeout(() => { playerHitCooldown = false; }, 100);

            // Clear any existing timers
            if (respawnTimer) {
                clearTimeout(respawnTimer);
                respawnTimer = null;
            }
            if (rapidFireTimer) {
                clearTimeout(rapidFireTimer);
                rapidFireTimer = null;
            }

            lives--;
            createExplosion(player.x, player.y, 30);
            playSound('explosion');

            if (dualFighterActive) {
                dualFighterActive = false;
            }

            if (lives <= 0) {
                gameState = 'GAME_OVER';
                player = null;
            } else {
                // Respawn player after delay
                player = null;
                respawnTimer = setTimeout(() => {
                    if (gameState === 'PLAYING' || gameState === 'BONUS') {
                        player = new Player(GAME_WIDTH / 2, GAME_HEIGHT - 80);
                    }
                    respawnTimer = null; // Clear reference
                }, 2000);
            }
        }

        // ===== CAPTURE MECHANICS =====
        function capturePlayer(capturingBoss) {
            if (!player || playerHitCooldown) return; // Safety check + prevent multiple captures

            // Set cooldown
            playerHitCooldown = true;
            setTimeout(() => { playerHitCooldown = false; }, 100);

            // Clear existing respawn timer
            if (respawnTimer) {
                clearTimeout(respawnTimer);
                respawnTimer = null;
            }

            playSound('tractorBeam');
            capturedShip = {
                boss: capturingBoss,
                x: player.x,
                y: player.y
            };
            capturingBoss.capturedShip = capturedShip;

            lives--;
            if (lives <= 0) {
                gameState = 'GAME_OVER';
            }

            // Respawn player after delay
            player = null;
            respawnTimer = setTimeout(() => {
                if (gameState === 'PLAYING') {
                    player = new Player(GAME_WIDTH / 2, GAME_HEIGHT - 80);
                }
                respawnTimer = null;
            }, 2000);
        }

        function rescueCapturedShip() {
            if (capturedShip) {
                dualFighterActive = true;
                capturedShip = null;
                playSound('extraLife');
            }
        }

        // ===== SCORE SYSTEM =====
        function addScore(points) {
            score += points;

            // Check for extra life
            if (score >= extraLifeThreshold) {
                extraLifeThreshold += 10000;
                if (lives < 5) {
                    lives++;
                    playSound('extraLife');
                    showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2, '+1 LIFE', COLORS.scoreBonus);
                }
            }

            // Update high score
            if (score > highScore) {
                highScore = score;
                saveHighScore();
            }
        }

        // ===== FLOATING TEXT =====
        let floatingTexts = [];
        function showFloatingText(x, y, text, color) {
            floatingTexts.push({
                x: x,
                y: y,
                text: text,
                color: color,
                life: 60,
                vy: -1
            });
        }

        function updateFloatingTexts() {
            floatingTexts.forEach(ft => {
                ft.y += ft.vy;
                ft.life--;
            });
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);
        }

        function drawFloatingTexts() {
            floatingTexts.forEach(ft => {
                ctx.globalAlpha = ft.life / 60;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 18px Orbitron';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1;
            });
        }

            name: ['A', 'A', 'A'],

            rank: 0
        };

                    {name: 'ACE', score: 125400, stage: 18},

                    {name: 'AVX', score: 31500, stage: 7},
                    {name: 'TEC', score: 28900, stage: 6},
                    {name: 'WNG', score: 25400, stage: 6},
                    {name: 'ENG', score: 22100, stage: 5},
                    {name: 'HNR', score: 20000, stage: 5}
                ];
            }
            // Update high score from leaderboard
            if (leaderboard.length > 0) {
                highScore = leaderboard[0].score;
            }

        function checkHighScore() {
            // Check if score qualifies for top 10
            if (leaderboard.length < 10 || score > leaderboard[leaderboard.length - 1].score) {
                // Find rank
                let rank = 0;
                for (let i = 0; i < leaderboard.length; i++) {
                    if (score > leaderboard[i].score) {
                        rank = i;
                        break;
                    }
                    rank = i + 1;
                }
                nameEntryData.rank = rank;
                nameEntryData.name = ['A', 'A', 'A'];
                nameEntryData.position = 0;
                gameState = 'NAME_ENTRY';
                return true;
            }
            return false;
        }

        function addToLeaderboard() {
            const name = nameEntryData.name.join('');
            const entry = {
                name: name,
                score: score,
                stage: currentStage - 1
            };

            leaderboard.splice(nameEntryData.rank, 0, entry);
            if (leaderboard.length > 10) {
                leaderboard = leaderboard.slice(0, 10);
            }

            saveLeaderboard();
            loadLeaderboard(); // Refresh high score
        }

        function loadHighScore() {
            // Compatibility function - now uses leaderboard
            loadLeaderboard();
        }

        function saveHighScore() {

            saveLeaderboard();
        }
