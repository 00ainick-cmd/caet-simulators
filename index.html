        // ===== CAET QUESTION SYSTEM =====
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let selectedAnswer = 0;
        let questionTimer = 0;
        let questionStartTime = 0;
        let correctCount = 0;

        function startQuestions() {
            gameState = 'QUESTIONS';
            currentQuestions = generateQuestions(5);
            currentQuestionIndex = 0;
            selectedAnswer = 0;
            correctCount = 0;
            questionStartTime = Date.now();
            questionTimer = 20;
        }

        function generateQuestions(count) {
            const categories = Object.keys(caetQuestions);
            const questions = [];

            for (let i = 0; i < count; i++) {
                const category = categories[i % categories.length];
                const categoryQuestions = caetQuestions[category];
                const randomQ = categoryQuestions[Math.floor(Math.random() * categoryQuestions.length)];
                questions.push({
                    ...randomQ,
                    category: category
                });
            }

            return questions;
        }

        function updateQuestions() {
            // Update timer
            const elapsed = (Date.now() - questionStartTime) / 1000;
            questionTimer = Math.max(0, 20 - Math.floor(elapsed));

            if (questionTimer === 0) {
                // Timeout - treat as wrong answer
                handleAnswer(false);
            }

            // Handle input
            if (keys['ArrowUp']) {
                selectedAnswer = Math.max(0, selectedAnswer - 1);
                keys['ArrowUp'] = false;
            }
            if (keys['ArrowDown']) {
                selectedAnswer = Math.min(3, selectedAnswer + 1);
                keys['ArrowDown'] = false;
            }
            if (keys[' '] || keys['Enter']) {
                const currentQ = currentQuestions[currentQuestionIndex];
                const isCorrect = selectedAnswer === currentQ.correct;
                handleAnswer(isCorrect);
                keys[' '] = false;
                keys['Enter'] = false;
            }
        }

        function handleAnswer(isCorrect) {
            if (isCorrect) {
                addScore(500);
                correctCount++;
                playSound('correct');
                showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2, '+500', COLORS.scoreBonus);
            } else {
                score = Math.max(0, score - 200);
                playSound('wrong');
            }

            currentQuestionIndex++;

            if (currentQuestionIndex >= currentQuestions.length) {
                // All questions answered
                if (correctCount === currentQuestions.length) {
                    // Perfect! Bonus
                    addScore(2000);
                    showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2 + 40, 'PERFECT +2000', COLORS.perfect);
                }

                // Check for bonus stage
                if (currentStage % 3 === 0) {
                    startBonusStage();
                } else {
                    nextStage();
                }
            } else {
                // Next question
                selectedAnswer = 0;
                questionStartTime = Date.now();
                questionTimer = 20;
            }
        }

        function drawQuestions() {
            const currentQ = currentQuestions[currentQuestionIndex];

            // Background overlay
            ctx.fillStyle = 'rgba(10, 10, 46, 0.9)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Question box
            const boxX = 100;
            const boxY = 150;
            const boxWidth = GAME_WIDTH - 200;
            const boxHeight = 300;

            ctx.strokeStyle = COLORS.hudText;
            ctx.lineWidth = 3;
            ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

            // Category and timer
            ctx.fillStyle = COLORS.hudText;
            ctx.font = 'bold 14px Orbitron';
            ctx.textAlign = 'left';
            ctx.fillText(`[CATEGORY: ${formatCategory(currentQ.category)}]`, boxX + 20, boxY + 30);

            ctx.textAlign = 'right';
            ctx.fillStyle = questionTimer < 5 ? COLORS.warning : COLORS.hudText;
            ctx.fillText(`TIME: ${questionTimer}s`, boxX + boxWidth - 20, boxY + 30);

            // Question text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Orbitron';
            ctx.textAlign = 'left';
            wrapText(ctx, currentQ.question, boxX + 20, boxY + 70, boxWidth - 40, 24);

            // Answers
            ctx.font = 'bold 14px Orbitron';
            const answerY = boxY + 140;
            const letters = ['A', 'B', 'C', 'D'];

            currentQ.answers.forEach((answer, index) => {
                const y = answerY + index * 30;
                const isSelected = index === selectedAnswer;

                if (isSelected) {
                    ctx.fillStyle = COLORS.scoreBonus;
                    ctx.fillRect(boxX + 15, y - 18, boxWidth - 30, 25);
                    ctx.fillStyle = '#000000';
                } else {
                    ctx.fillStyle = '#ffffff';
                }

                ctx.fillText(`[${letters[index]}] ${answer}`, boxX + 25, y);
            });

            // Bonus info
            ctx.fillStyle = COLORS.scoreBonus;
            ctx.font = 'bold 13px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText('SCORE BONUS: +500 pts', GAME_WIDTH / 2, boxY + boxHeight - 20);

            // Progress
            ctx.fillText(`Question ${currentQuestionIndex + 1} / ${currentQuestions.length}`, GAME_WIDTH / 2, boxY - 20);
        }

        function formatCategory(category) {
            return category.replace(/([A-Z])/g, ' $1').trim().toUpperCase();
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let lineY = y;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                const testWidth = metrics.width;

                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, lineY);
                    line = words[n] + ' ';
                    lineY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, lineY);
        }

        // ===== BONUS STAGE =====
        let bonusStageTimer = 0;
        let bonusEnemiesDestroyed = 0;

        function startBonusStage() {
            gameState = 'BONUS';
            bonusStageTimer = 40 * 60; // 40 seconds at 60 FPS
            bonusEnemiesDestroyed = 0;

            // Create enemies in special pattern
            enemies = [];
            for (let i = 0; i < 20; i++) {
                const x = -100 + i * 50;
                const y = 100 + Math.sin(i * 0.5) * 100;
                const types = ['bee', 'butterfly', 'dragonfly'];
                const type = types[i % types.length];
                const enemy = new Enemy(type, x, y, i, 0);
                enemy.state = 'BONUS';
                enemy.bonusVx = 3;
                enemies.push(enemy);
            }

            showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 3, '*** CHALLENGING STAGE ***', COLORS.perfect);
        }

        function updateBonusStage() {
            bonusStageTimer--;

            // Move enemies in pattern
            enemies.forEach(enemy => {
                enemy.x += enemy.bonusVx;
                enemy.y += Math.sin(frameCount * 0.05) * 2;

                if (enemy.x > GAME_WIDTH + 50) {
                    enemy.x = -50;
                }
            });

            if (bonusStageTimer <= 0 || enemies.filter(e => e.active).length === 0) {
                // Bonus stage complete
                if (enemies.filter(e => !e.active).length === 20) {
                    addScore(10000);
                    showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2, 'PERFECT +10000', COLORS.perfect);
                }
                nextStage();
            }
        }

        function drawBonusStage() {
            // Timer
            ctx.fillStyle = COLORS.scoreBonus;
            ctx.font = 'bold 22px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText(`TIME: ${Math.ceil(bonusStageTimer / 60)}`, GAME_WIDTH / 2, 50);
        }

        // ===== STAGE MANAGEMENT =====
        function nextStage() {
            currentStage++;
            gameState = 'PLAYING';
            createFormation(currentStage);
            if (player) {
                player.x = GAME_WIDTH / 2;
                player.y = GAME_HEIGHT - 80;
            } else {
                player = new Player(GAME_WIDTH / 2, GAME_HEIGHT - 80);
            }
            dualFighterActive = false;
            capturedShip = null;

            showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 3, `STAGE ${currentStage}`, COLORS.hudText);
        }

        function checkStageComplete() {
            if (enemies.filter(e => e.active).length === 0 && gameState === 'PLAYING') {
                showFloatingText(GAME_WIDTH / 2, GAME_HEIGHT / 2, 'STAGE CLEAR', COLORS.scoreBonus);
                setTimeout(() => {
                    startQuestions();
                }, 2000);
                gameState = 'STAGE_CLEAR';
            }
        }

        // ===== ATTRACT MODE =====
        let attractTimer = 0;

        // ===== MENU SCREEN =====
        let menuSelection = 0;
        const menuOptions = ['START GAME', 'VIEW HIGH SCORES', 'BACK TO HOME'];

        function drawMenu() {
            // Title
            ctx.fillStyle = COLORS.hudText;
            ctx.font = 'bold 48px Orbitron';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 20;
            ctx.shadowColor = COLORS.hudText;

            const titleY = 80;
            ctx.fillText('HANGAR', GAME_WIDTH / 2, titleY);
            ctx.fillText('DEFENDER', GAME_WIDTH / 2, titleY + 60);
            ctx.shadowBlur = 0;

            // Subtitle
            ctx.font = '14px Orbitron';
            ctx.fillStyle = COLORS.player;
            ctx.fillText('Defend • Answer • Dominate', GAME_WIDTH / 2, titleY + 95);

            // Easter egg hint (subtle)
            if (konamiActivated) {
                ctx.font = 'bold 16px Orbitron';
                ctx.fillStyle = COLORS.perfect;
                ctx.fillText('★ KONAMI MODE ACTIVE ★', GAME_WIDTH / 2, titleY + 120);
            } else if (frameCount % 300 < 150) {
                ctx.font = '10px Orbitron';
                ctx.fillStyle = 'rgba(0, 255, 65, 0.3)';
                ctx.fillText('hint: try the konami code...', GAME_WIDTH / 2, titleY + 120);
            }

            // Menu options
            const menuStartY = 240;
            const menuSpacing = 50;

            for (let i = 0; i < menuOptions.length; i++) {
                const y = menuStartY + i * menuSpacing;

                // Highlight selected option
                if (i === menuSelection) {
                    ctx.fillStyle = COLORS.scoreBonus;
                    ctx.font = 'bold 24px Orbitron';

                    // Draw selection arrows
                    ctx.fillText('►', GAME_WIDTH / 2 - 120, y);
                    ctx.fillText('◄', GAME_WIDTH / 2 + 120, y);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '20px Orbitron';
                }

                ctx.fillText(menuOptions[i], GAME_WIDTH / 2, y);
            }

            // Instructions
            ctx.font = '14px Orbitron';
            ctx.fillStyle = COLORS.hudText;
            ctx.fillText('[↑/↓: Navigate] [SPACE/ENTER: Select]', GAME_WIDTH / 2, 480);

            // Version info
            ctx.font = '10px Orbitron';
            ctx.fillStyle = 'rgba(0, 255, 65, 0.5)';
            ctx.fillText('v2.0 - Enhanced Edition', GAME_WIDTH / 2, 560);
        }

        function drawAttractMode() {
            // Title
            ctx.fillStyle = COLORS.hudText;
            ctx.font = 'bold 48px Orbitron';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 20;
            ctx.shadowColor = COLORS.hudText;

            const titleY = 100;
            ctx.fillText('HANGAR', GAME_WIDTH / 2, titleY);
            ctx.fillText('DEFENDER', GAME_WIDTH / 2, titleY + 60);
            ctx.shadowBlur = 0;

            // Subtitle
            ctx.font = 'bold 16px Orbitron';
            ctx.fillStyle = COLORS.player;
            ctx.fillText('Defend • Answer • Dominate', GAME_WIDTH / 2, titleY + 100);

            // Start prompt (blinking)
            if (frameCount % 60 < 30) {
                ctx.font = 'bold 20px Orbitron';
                ctx.fillStyle = COLORS.scoreBonus;
                ctx.fillText('>>> PRESS SPACE TO START <<<', GAME_WIDTH / 2, titleY + 140);
            }

            // Leaderboard
            ctx.font = 'bold 18px Orbitron';
            ctx.fillStyle = COLORS.hudText;
            ctx.fillText('═══════ HIGH SCORES ═══════', GAME_WIDTH / 2, titleY + 200);

            const rankText = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];
            ctx.font = '14px Orbitron';

            for (let i = 0; i < Math.min(10, leaderboard.length); i++) {
                const entry = leaderboard[i];
                const y = titleY + 230 + i * 25;
                const color = i === 0 ? COLORS.scoreBonus : (i < 3 ? COLORS.player : COLORS.hudText);
                ctx.fillStyle = color;
                ctx.fillText(
                    `${rankText[i].padEnd(5)} ${entry.name.padEnd(5)} ${entry.score.toString().padStart(6, '0')}  Stage ${entry.stage}`,
                    GAME_WIDTH / 2,
                    y
                );
            }
        }

        // ===== GAME OVER =====
        let gameOverTimer = 0;

        function drawGameOver() {
            ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = COLORS.warning;
            ctx.font = 'bold 60px Orbitron';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 30;
            ctx.shadowColor = COLORS.warning;
            ctx.fillText('GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2);
            ctx.shadowBlur = 0;

            ctx.font = 'bold 18px Orbitron';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`FINAL SCORE: ${score}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 60);
            ctx.fillText(`STAGES CLEARED: ${currentStage - 1}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 90);

            if (gameOverTimer > 180) {
                if (frameCount % 60 < 30) {
                    ctx.fillStyle = COLORS.scoreBonus;
                    ctx.fillText('PRESS SPACE TO CONTINUE', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 140);
                }
            }
        }

        // ===== NAME ENTRY SYSTEM =====
        const NAME_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ';

        function updateNameEntry() {
            // Arrow up/down to change character
            if (keys['ArrowUp']) {
                const currentChar = nameEntryData.name[nameEntryData.position];
                const currentIndex = NAME_CHARS.indexOf(currentChar);
                const newIndex = (currentIndex + 1) % NAME_CHARS.length;
                nameEntryData.name[nameEntryData.position] = NAME_CHARS[newIndex];
                keys['ArrowUp'] = false;
            }

            if (keys['ArrowDown']) {
                const currentChar = nameEntryData.name[nameEntryData.position];
                const currentIndex = NAME_CHARS.indexOf(currentChar);
                const newIndex = (currentIndex - 1 + NAME_CHARS.length) % NAME_CHARS.length;
                nameEntryData.name[nameEntryData.position] = NAME_CHARS[newIndex];
                keys['ArrowDown'] = false;
            }

            // Arrow left/right to move cursor
            if (keys['ArrowLeft']) {
                nameEntryData.position = Math.max(0, nameEntryData.position - 1);
                keys['ArrowLeft'] = false;
            }

            if (keys['ArrowRight']) {
                nameEntryData.position = Math.min(2, nameEntryData.position + 1);
                keys['ArrowRight'] = false;
            }

            // Space or Enter to confirm
            if (keys[' '] || keys['Enter']) {
                if (nameEntryData.position < 2) {
                    nameEntryData.position++;
                } else {
                    // Done - add to leaderboard
                    addToLeaderboard();
                    gameState = 'ATTRACT';
                }
                keys[' '] = false;
                keys['Enter'] = false;
            }
        }

        function drawNameEntry() {
            // Background
            ctx.fillStyle = 'rgba(10, 10, 46, 0.95)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Title
            ctx.fillStyle = COLORS.scoreBonus;
            ctx.font = 'bold 36px Orbitron';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 20;
            ctx.shadowColor = COLORS.scoreBonus;
            ctx.fillText('NEW HIGH SCORE!', GAME_WIDTH / 2, 150);
            ctx.shadowBlur = 0;

            // Rank and score
            const rankText = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];
            ctx.font = 'bold 22px Orbitron';
            ctx.fillStyle = COLORS.hudText;
            ctx.fillText(`RANK: ${rankText[nameEntryData.rank]}    SCORE: ${score.toString().padStart(6, '0')}`, GAME_WIDTH / 2, 220);

            // Prompt
            ctx.font = 'bold 18px Orbitron';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('ENTER YOUR INITIALS:', GAME_WIDTH / 2, 280);

            // Name entry boxes
            const boxWidth = 60;
            const boxHeight = 80;
            const spacing = 20;
            const totalWidth = 3 * boxWidth + 2 * spacing;
            const startX = (GAME_WIDTH - totalWidth) / 2;
            const boxY = 320;

            for (let i = 0; i < 3; i++) {
                const x = startX + i * (boxWidth + spacing);

                // Box
                if (i === nameEntryData.position) {
                    ctx.strokeStyle = COLORS.scoreBonus;
                    ctx.lineWidth = 4;
                } else {
                    ctx.strokeStyle = COLORS.hudText;
                    ctx.lineWidth = 2;
                }
                ctx.strokeRect(x, boxY, boxWidth, boxHeight);

                // Character
                ctx.fillStyle = i === nameEntryData.position ? COLORS.scoreBonus : '#ffffff';
                ctx.font = 'bold 48px Orbitron';
                ctx.textAlign = 'center';
                ctx.fillText(nameEntryData.name[i], x + boxWidth / 2, boxY + boxHeight / 2 + 18);

                // Cursor blink
                if (i === nameEntryData.position && frameCount % 30 < 15) {
                    ctx.fillStyle = COLORS.scoreBonus;
                    ctx.fillRect(x + 10, boxY - 10, boxWidth - 20, 4);
                }
            }

            // Instructions
            ctx.font = '14px Orbitron';
            ctx.fillStyle = COLORS.hudText;
            ctx.textAlign = 'center';
            ctx.fillText('[UP/DOWN: Change Letter]', GAME_WIDTH / 2, 470);
            ctx.fillText('[LEFT/RIGHT: Move Cursor]', GAME_WIDTH / 2, 495);
            ctx.fillText('[SPACE/ENTER: Next/Confirm]', GAME_WIDTH / 2, 520);
        }

        // ===== PAUSE SYSTEM =====
        function drawPause() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = COLORS.scoreBonus;
            ctx.font = 'bold 48px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText('PAUSED', GAME_WIDTH / 2, GAME_HEIGHT / 2);

            ctx.font = '18px Orbitron';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('Press SPACE to resume', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 50);

            ctx.font = '16px Orbitron';
            ctx.fillStyle = COLORS.hudText;
            ctx.fillText('Press M to return to menu', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 80);
        }

        // ===== INITIALIZE GAME =====
        function initGame() {
            // Create star field
            for (let i = 0; i < 150; i++) {
                stars.push(new Star());
            }

            // Initialize audio
            initAudio();

            // Load high score
            loadHighScore();

            // Set initial state
            gameState = 'ATTRACT';

            // Hide loading screen
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 1000);
        }

        // ===== START NEW GAME =====
        function startNewGame() {
            currentStage = 1;
            score = 0;
            lives = easterEggMode ? 99 : 3; // 99 lives if Konami code active
            extraLifeThreshold = 10000;
            gameState = 'PLAYING';
            dualFighterActive = false;
            capturedShip = null;

            player = new Player(GAME_WIDTH / 2, GAME_HEIGHT - 80);
            createFormation(currentStage);

            bullets = [];
            particles = [];
            powerUps = [];
        }

        // ===== MAIN UPDATE LOOP =====
        function update(deltaTime) {
            frameCount++;

            // Update stars
            stars.forEach(star => star.update());

            // Update particles
            particles.forEach(particle => particle.update());
            particles = particles.filter(p => p.active);

            // Update floating texts
            updateFloatingTexts();

            // State-specific updates
            switch(gameState) {
                case 'MENU':
                    // Menu is handled in keydown event
                    break;

                case 'ATTRACT':
                    attractTimer++;
                    if (keys[' ']) {
                        gameState = 'MENU';
                        keys[' '] = false;
                    }
                    if (keys['Escape']) {
                        gameState = 'MENU';
                        keys['Escape'] = false;
                    }
                    break;

                case 'PLAYING':
                    if (player) {
                        player.update(deltaTime);
                    }

                    bullets.forEach(bullet => bullet.update());
                    bullets = bullets.filter(b => b.active);

                    // Update power-ups
                    powerUps.forEach(powerUp => powerUp.update());
                    powerUps = powerUps.filter(p => p.active);

                    // Reduced formation swing from 30 to 20 to keep enemies on screen
                    const formationOffset = Math.sin(frameCount * 0.01) * 20;
                    enemies.forEach(enemy => enemy.update(formationOffset));

                    updateDiveAttacks();
                    checkCollisions();
                    checkStageComplete();
                    break;

                case 'STAGE_CLEAR':
                    // Wait for transition
                    break;

                case 'QUESTIONS':
                    updateQuestions();
                    break;

                case 'BONUS':
                    if (player) {
                        player.update(deltaTime);
                    }
                    bullets.forEach(bullet => bullet.update());
                    bullets = bullets.filter(b => b.active);
                    enemies.forEach(enemy => enemy.update(0));
                    checkCollisions();
                    updateBonusStage();
                    break;

                case 'PAUSED':
                    if (keys[' ']) {
                        gameState = 'PLAYING';
                        keys[' '] = false;
                    }
                    if (keys['m'] || keys['M']) {
                        gameState = 'MENU';
                        keys['m'] = false;
                        keys['M'] = false;
                    }
                    break;

                case 'GAME_OVER':
                    gameOverTimer++;
                    if (gameOverTimer === 180) {
                        // Check for high score after delay
                        if (!checkHighScore()) {
                            // Not a high score, continue to attract mode prompt
                        }
                    }
                    if (gameOverTimer > 180 && keys[' '] && gameState === 'GAME_OVER') {
                        gameState = 'MENU';
                        gameOverTimer = 0;
                        keys[' '] = false;
                    }
                    if (keys['Escape']) {
                        gameState = 'MENU';
                        gameOverTimer = 0;
                        keys['Escape'] = false;
                    }
                    break;

                case 'NAME_ENTRY':
                    updateNameEntry();
                    break;
            }

            // Pause check
            if (gameState === 'PLAYING' && keys['Escape']) {
                gameState = 'PAUSED';
                keys['Escape'] = false;
            }
        }

        // ===== MAIN DRAW LOOP =====
        function draw() {
            // Clear canvas
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Draw stars
            stars.forEach(star => star.draw());

            // State-specific rendering
            switch(gameState) {
                case 'MENU':
                    drawMenu();
                    break;

                case 'ATTRACT':
                    drawAttractMode();
                    break;

                case 'PLAYING':
                case 'STAGE_CLEAR':
                case 'BONUS':
                    // Draw enemies
                    enemies.forEach(enemy => {
                        if (enemy.active) enemy.draw();
                    });

                    // Draw bullets
                    bullets.forEach(bullet => bullet.draw());

                    // Draw power-ups
                    powerUps.forEach(powerUp => powerUp.draw());

                    // Draw player
                    if (player) {
                        if (dualFighterActive) {
                            // Draw two ships side-by-side
                            ctx.save();
                            ctx.translate(-30, 0);
                            player.draw();
                            ctx.restore();

                            ctx.save();
                            ctx.translate(30, 0);
                            player.draw();
                            ctx.restore();
                        } else {
                            player.draw();
                        }
                    }

                    // Draw particles
                    particles.forEach(particle => particle.draw());

                    // Draw HUD
                    drawHUD();

                    // Draw floating texts
                    drawFloatingTexts();

                    if (gameState === 'BONUS') {
                        drawBonusStage();
                    }
                    break;

                case 'QUESTIONS':
                    drawQuestions();
                    break;

                case 'PAUSED':
                    // Draw game state first
                    enemies.forEach(enemy => {
                        if (enemy.active) enemy.draw();
                    });
                    bullets.forEach(bullet => bullet.draw());
                    if (player) player.draw();
                    drawHUD();

                    // Then draw pause overlay
                    drawPause();
                    break;

                case 'GAME_OVER':
                    drawGameOver();
                    break;

                case 'NAME_ENTRY':
                    drawNameEntry();
                    break;
            }
        }

        // ===== GAME LOOP =====
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastFrameTime;

            if (deltaTime >= FRAME_TIME) {
                update(deltaTime);
                draw();
                lastFrameTime = timestamp;
            }

            requestAnimationFrame(gameLoop);
        }

        // ===== MENU SELECTION HANDLER =====
        function handleMenuSelection() {
            playSound('correct');
            switch(menuSelection) {
                case 0: // START GAME
                    startNewGame();
                    break;
                case 1: // VIEW HIGH SCORES
                    gameState = 'ATTRACT';
                    break;
                case 2: // BACK TO HOME
                    // Navigate back to parent directory
                    window.location.href = '../';
                    break;
            }
            keys[' '] = false;
            keys['Enter'] = false;
        }

        // ===== INPUT HANDLING =====
        document.addEventListener('keydown', (e) => {
            // Konami Code Detection
            if (konamiCode[konamiProgress] === e.key) {
                konamiProgress++;
                if (konamiProgress === konamiCode.length) {
                    konamiActivated = true;
                    konamiProgress = 0;
                    // Activate easter egg mode
                    easterEggMode = true;
                    lives = 99;
                    playSound('extraLife');
                    console.log('🎮 KONAMI CODE ACTIVATED! 99 Lives Mode!');
                }
            } else {
                konamiProgress = 0;
            }

            keys[e.key] = true;

            // Menu navigation
            if (gameState === 'MENU') {
                if (e.key === 'ArrowUp') {
                    menuSelection = (menuSelection - 1 + menuOptions.length) % menuOptions.length;
                    playSound('shoot');
                } else if (e.key === 'ArrowDown') {
                    menuSelection = (menuSelection + 1) % menuOptions.length;
                    playSound('shoot');
                } else if (e.key === ' ' || e.key === 'Enter') {
                    handleMenuSelection();
                }
            }

            // Prevent default for game keys
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Enter', 'Escape'].includes(e.key)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // ===== START GAME =====
        window.addEventListener('load', () => {
            initGame();
            requestAnimationFrame(gameLoop);
        });

    </script>
</body>
</html>
